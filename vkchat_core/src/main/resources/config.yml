
# config-version: 1 (авто-обновление при изменении)
config-version: 1

chat:
  # Радиус локального чата (используется только для сторонних плагинов, если нужно)
  local-radius: 100
  # Символ глобального чата. Наш плагин автоматически вырежет его перед отправкой сообщения в EssentialsX!
  global-symbol: "!"

# ==========================================
# ДИНАМИЧЕСКИЙ MOTD СЕРВЕРА
# ==========================================
motd:
  enabled: true
  line-1: "&6&l✨ CHRDK REBORN ✨ &8▸ &fMMO-Выживание 1.16.5"
  line-2-default: "&eАртефакты &8• &aГир &8• &dНации &8• &bРаботы &8• &cБоссы &8• &6Ивенты &8• &fВК БОТ"

