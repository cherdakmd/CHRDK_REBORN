# ==========================================
#  БАЗА ДАННЫХ (MySQL / SQLite)
# ==========================================
database:
  # Если true, плагин будет использовать удаленную MySQL базу данных
  # Если false, плагин создаст локальный файл database.db (SQLite)
  use-mysql: false
  
  mysql:
    host: "localhost"
    port: 3306
    database: "vkchat"
    username: "root"
    password: "password"
    # Параметры подключения
    properties: "?useSSL=false&autoReconnect=true"

# ==========================================
# ⚙ ОСНОВНЫЕ НАСТРОЙКИ ВКОНТАКТЕ
# ==========================================
vk:
  token: "YOUR_VK_GROUP_TOKEN" # Токен группы (Получать в настройках группы -> Работа с API)
  group-id: 123456789          # ID вашей группы (только цифры, без минуса)
  peer-id: 2000000001          # ID основной беседы
  require-membership: true     # Требовать ли подписку на группу и беседу для игры
  chat-invite-link: "https://vk.me/join/zgfelZWZPZrqpNSW1whkRJ3zAZvCvqVAFjc=" # Ссылка на беседу
  group-link: "https://vk.com/chrdk_reborn"  # Ссылка на группу
  anti-spam-cooldown: 3        # Задержка между отправкой сообщений из ВК в игру (сек)
  
  # Права доступа на админ-команду !cmd из ВК (выполняет консольные команды сервера)
  admin-vk-ids:
    - 123456789
    - 987654321

# ==========================================
#  СЛУЧАЙНЫЙ СПАВН (Без центрального спавна)
# ==========================================
random-spawn:
  enabled: true
  world: "world"       # В каком мире спавнить
  min-x: -5000
  max-x: 5000
  min-z: -5000
  max-z: 5000

# ==========================================
# ️ УЛЬТРА-БЕЗОПАСНОСТЬ (2FA)
# ==========================================
security:
  2fa-enabled: true            # Включить двухфакторную аутентификацию
  require-on-new-ip: true      # Запрашивать код в ВК, если игрок зашел с неизвестного IP
  require-2fa-always: false    # Требовать 2FA обязательно при КАЖДОМ входе для максимальной защиты (защита от кражи аккаунтов на BungeeCord)
  code-length: 4               # Длина кода подтверждения (цифры)
  block-time: 120              # Сколько секунд дается на ввод 2FA до кика

# ==========================================
#  ИНТЕГРАЦИЯ С АКТИВНОСТЬЮ ВКОНТАКТЕ
# ==========================================
vk-activity:
  # Награды за поддержку группы (лайки, репосты)
  rewards:
    like-post: 5               # Репутации за лайк
    repost-post: 15            # Репутации за репост

# ==========================================
#  АВТОРИЗАЦИЯ И БЕЗОПАСНОСТЬ
# ==========================================
auth:
  link-time-limit: 60       # Секунд на ввод пароля/привязку до кика
  require-auth: true        # Включена ли регистрация (/register, /login)
  safety-platform: true     # Временная 3x3 барьерная подставка под ноги во время логина (антивыпад с одноблоковых спавнов)
  bcrypt-rounds: 12         # Сила хеширования (12 оптимально)
  auto-login-ip: true       # Авто-вход без пароля с того же IP (действует 24ч)
  twink-protection: true    # Запретить привязку нескольких аккаунтов к 1 ВК

# ==========================================
#  БОНУСЫ И ЭКОНОМИКА
# ==========================================
bonus:
  first-link-enabled: true  # Выдавать бонус при первой привязке
  money: 500.0              # Сумма Vault валюты
  commands:                 # Команды от лица консоли
    - "give {player} diamond 1"

stats:
  money-weight: 0.1             # Вес 1 монеты для топа (0.1 = 10$ дают 1 очко)
  top-broadcast-interval: 3600  # Как часто выводить топ (в сек)

# ==========================================
#  ИНТЕРАКТИВ И ИГРЫ В БЕСЕДЕ ВК
# ==========================================
riddles:
  enabled: true             # Включить систему загадок и примеров
  interval: 900             # Интервал появления (сек)
  reward: 5                 # Награда очками ВК
  money-reward: 100.0       # Доп. награда виртами (Vault)

  riddles-cooldown: 60      # Кулдаун для игрока на попытки ответа (в сек)
  roulette-reward: 30       # Награда за победу в Русской Рулетке
  roulette-cooldown: 300    # Перезарядка рулетки в беседе (сек)

reputation:
  enabled: true             # Репутация за общение
  message-reward: 1         # Очков за обычное сообщение
  daily-join-reward: 10     # Очков за команду !бонус
  play-time-reward: 1       # Очков репы за онлайн на сервере
  play-time-interval: 60    # Начислять каждые X минут
  min-message-length: 5     # Минимальная длина сообщения (символов)
  cooldown-seconds: 30      # Задержка между сообщениями (от фарма)
  to-money-rate: 10.0       # Курс: 10 репы = 1 монета в игре
  death-loss: 5             # Штраф репутации за смерть (от моба/падения)
  pvp-loss: 15              # Штраф репутации за смерть от другого игрока
  pvp-steal: true           # Забирает ли убийца потерянную репутацию жертвы?

# ==========================================
#  МОДЕРАЦИЯ: ВАРНЫ И АВТОБАНЫ
# ==========================================
moderation:
  warns:
    enabled: true
    # 3 варна = бан на сутки, далее сроки растут.
    ban-thresholds:
      3: 1
      6: 3
      9: 7
      12: 30
    default-repeat-ban-days: 30
