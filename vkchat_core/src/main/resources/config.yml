#  Telegram:  https://t.me/cherdakmd
# ==========================================

# ==========================================
#  БАЗА ДАННЫХ (MySQL / SQLite)
# ==========================================
database:
  # Если true, плагин будет использовать удаленную MySQL базу данных
  # Если false, плагин создаст локальный файл database.db (SQLite)
  use-mysql: false
  
  mysql:
    host: "localhost"
    port: 3306
    database: "vkchat"
    username: "root"
    password: "password"
    # Параметры подключения
    properties: "?useSSL=false&autoReconnect=true"

# ==========================================
# ⚙ ОСНОВНЫЕ НАСТРОЙКИ ВКОНТАКТЕ
# ==========================================
vk:
  token: "YOUR_VK_GROUP_TOKEN" # Токен группы (Получать в настройках группы -> Работа с API)
  group-id: 123456789          # ID вашей группы (только цифры, без минуса)
  peer-id: 2000000001          # ID основной беседы
  require-membership: true     # Требовать ли подписку на группу для игры
  require-chat-membership: false # Требовать ли подписку на беседу (нужен токен с messages scope)
  chat-invite-link: "https://vk.me/join/zgfelZWZPZrqpNSW1whkRJ3zAZvCvqVAFjc=" # Ссылка на беседу
  group-link: "https://vk.com/chrdk_reborn"  # Ссылка на группу
  anti-spam-cooldown: 3        # Задержка между отправкой сообщений из ВК в игру (сек)
  
  # Права доступа на админ-команду !cmd из ВК (выполняет консольные команды сервера)
  admin-vk-ids:
    - 123456789
    - 987654321

# ==========================================
#  СЛУЧАЙНЫЙ СПАВН (Без центрального спавна)
# ==========================================
random-spawn:
  enabled: true
  world: "world"       # В каком мире спавнить
  min-x: -5000
  max-x: 5000
  min-z: -5000
  max-z: 5000

# ==========================================
# ️ УЛЬТРА-БЕЗОПАСНОСТЬ (2FA)
# ==========================================
security:
  2fa-enabled: true            # Включить двухфакторную аутентификацию
  require-on-new-ip: true      # Запрашивать код в ВК, если игрок зашел с неизвестного IP
  require-2fa-always: false    # Требовать 2FA обязательно при КАЖДОМ входе для максимальной защиты
  skip-2fa-local-ip: true      # Пропускать 2FA для локального IP (127.0.0.1) — для тестирования
  code-length: 4               # Длина кода подтверждения (цифры)
  block-time: 120              # Сколько секунд дается на ввод 2FA до кика

# ==========================================
#  ИНТЕГРАЦИЯ С АКТИВНОСТЬЮ ВКОНТАКТЕ
# ==========================================
vk-activity:
  # Награды за поддержку группы (лайки, репосты)
  rewards:
    like-post: 5               # Репутации за лайк
    repost-post: 15            # Репутации за репост

# ==========================================
#  АВТОРИЗАЦИЯ И БЕЗОПАСНОСТЬ
# ==========================================
auth:
  link-time-limit: 60       # Секунд на ввод пароля/привязку до кика
  require-auth: true        # Включена ли регистрация (/register, /login)
  safety-platform: true     # Временная 3x3 барьерная подставка под ноги во время логина
  bcrypt-rounds: 12         # Сила хеширования (12 оптимально)
  auto-login-ip: true       # Авто-вход без пароля с того же IP (действует 24ч)
  twink-protection: true    # Запретить привязку нескольких аккаунтов к 1 ВК
  auto-whitelist: true      # Автоматически добавлять в вайтлист после привязки ВК

# ==========================================
#  БОНУСЫ И ЭКОНОМИКА
# ==========================================
bonus:
  first-link-enabled: true  # Выдавать бонус при первой привязке
  money: 500.0              # Сумма Vault валюты
  commands:                 # Команды от лица консоли
    - "give {player} diamond 1"

stats:
  death-messages-to-vk: false   # Смерти в ВК шлёт vkchat_chat
  money-weight: 0.1             # Вес 1 монеты для топа (0.1 = 10$ дают 1 очко)
  top-broadcast-interval: 3600  # Как часто выводить топ (в сек)

# ==========================================
#  ИНТЕРАКТИВ И ИГРЫ В БЕСЕДЕ ВК
# ==========================================
riddles:
  enabled: true             # Включить систему загадок и примеров
  interval: 900             # Интервал появления (сек)
  reward: 5                 # Награда очками ВК
  money-reward: 100.0       # Доп. награда виртами (Vault)

  riddles-cooldown: 60      # Кулдаун для игрока на попытки ответа (в сек)

reputation:
  enabled: true
  message-reward: 1
  daily-join-reward: 10
  play-time-reward: 1
  play-time-interval: 60
  min-message-length: 5
  cooldown-seconds: 30
  to-money-rate: 10.0
  death-loss: 5
  pvp-loss: 15
  pvp-steal: true

  # ==========================================
  #  PVP СИСТЕМА РЕПУТАЦИИ
  # ==========================================
  pvp:
    # Процент репутации, который жертва теряет при убийстве игроком
    loss-percent: 5.0
    # Минимальная потеря (даже если 5% < 10)
    min-loss: 10
    # Максимальная потеря за одно убийство
    max-loss: 500
    # Минимальная репутация жертвы для кражи (защита новичков)
    min-victim-rep: 50
    # Кулдаун на пару убийца-жертва (антифарм, в минутах)
    cooldown-minutes: 5

    # Масштабирование по разнице репутации
    # Если убийца намного сильнее жертвы — награда уменьшается
    # Если жертва намного сильнее убийцы — награда увеличивается
    rep-diff-scaling: 1.0     # 0 = выкл, 1.0 = нормальный масштаб
    rep-diff-threshold: 500   # Разница репы, после которой включается масштабирование

    # Серия убийств (killstreak)
    killstreak:
      bonus-threshold: 3      # Серия, с которой начинается бонус
      bonus-percent: 10       # Бонус в % от краденой репы за каждую серию
      max-bonus: 100          # Максимальный бонус за серию

    # Защита от серий смертей
    death-streak:
      threshold: 3            # Серия смертей, с которой включается защита
      loss-reduction: 0.5     # Снижение потери на X% при серии

  # PvE смерть (мобы, падение и т.д.)
  pve:
    loss-percent: 2.0
    min-loss: 5
    max-loss: 100

# ==========================================
#  МОДЕРАЦИЯ: ВАРНЫ И АВТОБАНЫ
# ==========================================
moderation:
  warns:
    enabled: true
    # 3 варна = бан на сутки, далее сроки растут.
    ban-thresholds:
      3: 1
      6: 3
      9: 7
      12: 30
    default-repeat-ban-days: 30

# ==========================================
#  ДВУХФАКТОРНАЯ АУТЕНТИФИКАЦИЯ (2FA)
# ==========================================
auth:
  2fa:
    enabled: true
    code-length: 4             # Длина кода (4-6 цифр)
    expiry-minutes: 5          # Время действия кода
    max-attempts: 3            # Максимум попыток ввода
    lockout-minutes: 5         # Блокировка при превышении попыток
    require-every-login: true  # Требовать 2FA при каждом входе

  link:
    code-length: 6             # Длина кода привязки ВК
    code-expiry-minutes: 10    # Время действия кода привязки
    require-membership: true   # Требовать вступление в группу ВК
    anti-twink: true           # Один ВК = один аккаунт
    max-accounts-per-vk: 1     # Максимум аккаунтов на ВК

  session:
    timeout-minutes: 30        # Таймаут неактивной сессии

# ==========================================
#  УВЕДОМЛЕНИЯ
# ==========================================
notifications:
  join:
    enabled: false             # Вход — шлёт vkchat_chat
    show-vk-status: true
  leave:
    enabled: false             # Выход — шлёт vkchat_chat
    show-vk-status: true
  auth:
    enabled: true
