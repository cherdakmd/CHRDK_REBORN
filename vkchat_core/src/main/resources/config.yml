
chat:
  # Радиус локального чата (используется только для сторонних плагинов, если нужно)
  local-radius: 100
  # Символ глобального чата. Наш плагин автоматически вырежет его перед отправкой сообщения в EssentialsX!
  global-symbol: "!"

# ==========================================
# ДИНАМИЧЕСКИЙ MOTD СЕРВЕРА
# ==========================================
motd:
  enabled: true
  line-1: "&6&l★ CHRDK REBORN ★ &7» &fMMO-Выживание с ВК БОТом!"
  line-2-default: "&eЗаходи и развивай своего персонажа!"

