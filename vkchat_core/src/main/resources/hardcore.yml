# ==========================================
#  ХАРДКОРНЫЕ МЕХАНИКИ (Ранения, Спавн, Кровавая Луна)
# ==========================================
hardcore:
  
  # Локальный чат
  chat:
    local-enabled: true
    radius: 100         # Радиус, в котором игроки слышат обычный чат
    global-prefix: "!"  # Символ для глобального чата (и отправки в ВК)

  # Эффекты при возрождении
  respawn-effects:
    enabled: true
    # Список возможных эффектов (ЭФФЕКТ;МИН_СЕКУНД;МАКС_СЕКУНД;УРОВЕНЬ)
    positive:
      - "FAST_DIGGING;60;300;1"
      - "SPEED;60;180;1"
      - "DAMAGE_RESISTANCE;30;120;1"
    negative:
      - "SLOW;60;300;1"
      - "WEAKNESS;60;180;1"
      - "HUNGER;30;120;1"
      - "BLINDNESS;10;30;0"
  
  # Система Кровотечения и Ранений
  bleeding:
    enabled: true
    # Меньше скольких сердец (1 сердце = 2 HP) начинается кровотечение
    threshold-hp: 6.0 
    # Эффекты при ранении
    effect: "SLOW"
    effect-level: 1

  # Кровавая луна (Blood Moon)
  blood-moon:
    enabled: true
    chance: 10 # Шанс 10% каждую ночь
    mob-multiplier: 2.0 # Во сколько раз мобы бьют сильнее и имеют больше ХП
    reward-multiplier: 3.0 # Множитель лута (денег и репутации)

# ==========================================
#  СИСТЕМА ФРАКЦИЙ И ПРИВАТОВ (Nations & Claims)
# ==========================================
nations:
  enabled: true
  creation-cost: 500 # Репутации ВКонтакте для создания клана/группы
  max-members: 15    # Максимум участников (если 1 - значит это соло-приват)
  max-claims: 9      # Максимум чанков (территорий) на фракцию
  
  # Интеграция с TAB (Префикс клана перед ником)
  tab-integration:
    enabled: true
    format: "&7[{nation}] &r"

  claims:
    # Предметы, которыми можно "кормить" энергоблок для поддержания привата
    # ПРЕДМЕТ:СЕКУНД_ПРИВАТА
    fuel:
      DIAMOND: 86400         # 1 алмаз = 24 часа
      EMERALD: 43200         # 1 изумруд = 12 часов
      NETHERITE_INGOT: 604800 # 1 незерит = 7 дней
      GOLD_INGOT: 3600       # 1 золото = 1 час
      
    # Жертвоприношение (Убийство игрока на территории привата)
    sacrifice-enabled: true
    sacrifice-time: 86400    # Дает 24 часа привата за кровь врага
    # Защита от накрутки: нельзя убивать одного и того же чаще, чем 1 раз в X секунд
    sacrifice-cooldown: 86400 

    # РЕЙДЫ (Разрушение баз)
    # Если энергия привата падает до 0, он становится уязвимым для других
    # Как только энергия кончается, приват спадает и чанки перестают принадлежать фракции
    raid-alert: true # Оповещать ли в ВК, когда энергия привата почти на нуле (остался 1 час)


