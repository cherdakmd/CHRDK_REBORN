riddles:
  1:
    question: "Он зелёный, тихий и взрывается. Кто это?"
    answer: "крипер"
  2:
    question: "Самый прочный блок в игре, который нельзя сломать в выживании?"
    answer: "бедрок"
  3:
    question: "В какое измерение нужно попасть, чтобы убить дракона?"
    answer: "энд"
  4:
    question: "Какая руда используется для создания механизмов и красной пыли?"
    answer: "редстоун"
  5:
    question: "Какой высокий моб телепортируется, ворует блоки и боится воды?"
    answer: "эндермен"
  6:
    question: "Как называется ад в майнкрафте?"
    answer: "незер"
  7:
    question: "Из чего крафтится хлеб?"
    answer: "пшеница"
  8:
    question: "Кого нужно призвать и убить, чтобы получить звезду незера?"
    answer: "визер"
  9:
    question: "Какой блок светится в темноте и растет под водой на дне океана?"
    answer: "морской фонарь"
  10:
    question: "Животное, которое можно приручить костью?"
    answer: "волк"
  11:
    question: "Деревня жителей охраняется железным мобом. Как его зовут?"
    answer: "голем"