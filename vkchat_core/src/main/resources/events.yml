# ==========================================
#  СИСТЕМА КОНТРАКТОВ (Bounty)
# ==========================================
bounty:
  enabled: true
  min-reward: 50     # Минимальная сумма заказа (в очках репутации)
  tax-percent: 5     # Комиссия (5% очков сгорит при заказе)
  
  # Интеграция с TAB (Добавляется к суффиксу/префиксу заказанного)
  tab-integration:
    enabled: true
    target-suffix: " &c&l[ ЗАКАЗ]"

# ==========================================
#  ЕЖЕДНЕВНЫЕ КВЕСТЫ (Quests)
# ==========================================
quests:
  enabled: true
  # Интервал запуска нового квеста (в секундах, 86400 = 24ч)
  interval: 86400 
  
  # Список возможных квестов (выбирается случайно)
  list:
    zombie_hunter:
      type: "KILL"      # Тип: KILL, MINE, FISH
      target: "ZOMBIE"  # Что убивать/ломать
      amount: 100       # Количество
      reward:           # Награда (выдается первому выполнившему)
        reputation: 500
        commands:
          - "give {player} diamond 5"
    
    diamond_miner:
      type: "MINE"
      target: "DIAMOND_ORE"
      amount: 32
      reward:
        reputation: 1000
        commands:
          - "give {player} netHERITE_INGOT 1"

# ==========================================
#  АИРДРОПЫ ВКОНТАКТЕ (Airdrops)
# ==========================================
airdrops:
  enabled: true
  interval: 14400 # Каждые 4 часа (в секундах)
  
  # Радиус падения (от 0 до X по X и Z)
  radius: 3000
  world: "world"  # В каком мире падает
  
  # Блок сундука
  chest-material: "TRAPPED_CHEST"
  
  reputation-reward: 150 # Сколько репутации ВК получает тот, кто открыл сундук!
  
  # Лут в сундуке (Материал, Мин. Кол-во, Макс. Кол-во, Шанс %)
  loot:
    - "DIAMOND;1;5;50"
    - "GOLDEN_APPLE;1;2;30"
    - "ENCHANTED_GOLDEN_APPLE;1;1;5"
    - "EMERALD;10;32;100"
    - "NETHERITE_SCRAP;1;2;10"
