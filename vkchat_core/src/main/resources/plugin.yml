name: VKChat
version: 3.2.0
main: ru.example.vkchat.VKChatPlugin
api-version: "1.16"
softdepend: [Vault]
commands:
  vklink:
    description: Получить уникальный код для привязки аккаунта ВКонтакте
    usage: /vklink
    permission: vkchat.player
  vkunlink:
    description: Отвязать аккаунт ВКонтакте от игрового профиля
    usage: /vkunlink
    permission: vkchat.player
  vkchat:
    description: Панель администратора VKChat и управление экономикой
    usage: /vkchat <subcommand>
    permission: vkchat.admin
  register:
    description: Зарегистрировать игровой аккаунт
    usage: /register <password>
    permission: vkchat.player
  2fa:
    description: Ввести одноразовый код двухфакторной аутентификации (2FA) или включить/выключить 2FA
    usage: /2fa <код|on|off>
    permission: vkchat.player
  resend:
    description: Повторно отправить код 2FA в ЛС ВК
    usage: /resend
    permission: vkchat.player
  login:
    description: Авторизоваться в игровом аккаунте
    usage: /login <password>
    permission: vkchat.player
  changepass:
    description: Изменить текущий пароль аккаунта
    usage: /changepass <old> <new>
    permission: vkchat.player
  logout:
    description: Выйти из авторизованной сессии аккаунта
    usage: /logout
    permission: vkchat.player
  rep:
    description: Посмотреть текущий баланс репутации ВКонтакте
    usage: /rep
    permission: vkchat.player
  pay:
    description: Передать очки репутации ВК другому игроку
    usage: /pay <игрок> <количество>
    aliases: [transfer, перевести, реппей]
    permission: vkchat.player
  vk:
    description: Открыть игровое меню ВКонтакте
    usage: /vk
    permission: vkchat.player
  menu:
    description: Открыть главное меню сервера
    usage: /menu
    aliases: [меню, servermenu, mainmenu]
    permission: vkchat.player
  mute:
    description: Замутить игрока
    usage: /mute <ник> <минуты> [причина]
    permission: vkchat.moderation.warn
  unmute:
    description: Размутить игрока
    usage: /unmute <ник>
    permission: vkchat.moderation.warn
  ignore:
    description: Игнорировать игрока
    usage: /ignore <ник>
    permission: vkchat.player
  warn:
    description: Выдать предупреждение игроку
    usage: /warn <player> <reason>
    permission: vkchat.moderation.warn
  unwarn:
    description: Снять предупреждения с игрока
    usage: /unwarn <player> [amount]
    permission: vkchat.moderation.warn
  warns:
    description: Посмотреть предупреждения игрока
    usage: /warns <player>
    permission: vkchat.moderation.warn
  clearwarns:
    description: Очистить предупреждения игрока
    usage: /clearwarns <player>
    permission: vkchat.moderation.warn
  bal:
    description: Посмотреть баланс репутации ВКонтакте
    usage: /bal
    aliases: [balance, баланс]
    permission: vkchat.player
  online:
    description: Посмотреть количество игроков онлайн
    usage: /online
    aliases: [онлайн, who]
    permission: vkchat.player
  lastseen:
    description: Посмотреть когда игрок был последний раз
    usage: /lastseen <игрок>
    aliases: [был, seen]
    permission: vkchat.player
permissions:
  vkchat.player:
    description: Доступ к базовым командам игрока
    default: true
  vkchat.admin:
    description: Доступ к командам администратора
    default: op
  vkchat.moderation.warn:
    description: Доступ к системе предупреждений
    default: op
