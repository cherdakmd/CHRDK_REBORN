settings:
  enabled: true
  max-level: 50
  reputation-per-level: 20
  # Очков навыков выдается каждые X уровней
  skill-point-every-levels: 10

# Настройки усталости (Fatigue)
fatigue:
  enabled: true
  max-fatigue: 1000
  fatigue-per-action: 3        # Усталость за одно действие
  rest-per-minute: 20        # Сколько усталости отдыхает за минуту онлайна

jobs:
  miner:
    name: "&7Шахтер"
    exp-multiplier: 1.0
  woodcutter:
    name: "&6Лесоруб"
    exp-multiplier: 1.0
  farmer:
    name: "&eФермер"
    exp-multiplier: 1.0
  alchemist:
    name: "&dАлхимик"
    exp-multiplier: 1.5
  blacksmith:
    name: "&8Кузнец"
    exp-multiplier: 1.5
  hunter:
    name: "&cОхотник"
    exp-multiplier: 1.0
  fisherman:
    name: "&bРыбак"
    exp-multiplier: 1.0

# Jobs 2.0: ежедневные задания профессий и специализации.
daily:
  enabled: true
  default-target: 100
  reward-reputation: 150
  reward-item: EXPERIENCE_BOTTLE
  reward-item-amount: 8
  targets:
    miner: 80
    woodcutter: 100
    farmer: 120
    alchemist: 8
    blacksmith: 20
    hunter: 60
    fisherman: 40

specializations:
  required-level: 20
  # Одна специализация на профессию. Меняется только вручную админом через data-файл.
  xp-bonus: 0.15
  stamina-reduction: 0.25
  reward-bonus: 0.20

# Jobs 3.0: ванильные ранговые награды за уровни профессий.
# Никаких NBT-предметов: только обычные vanilla items.
rank-rewards:
  enabled: true
  items: {}

# Jobs 3.1: репутация ВК за действия профессий.
# Без дневных/часовых лимитов. Баланс держится малой базой, уровнем профессии и антиабузом.
jobs-reputation:
  enabled: true
  message-mode: chat_batch # silent / actionbar / chat_batch
  message-interval-seconds: 20
  level-bonus-per-level: 0.01
  max-level-bonus: 0.50
  donate-multipliers:
    spark: 1.50
    flame: 2.50
    star: 3.50
    legend: 5.00
  jobs:
    miner:
      enabled: true
      base: 0.18
    woodcutter:
      enabled: true
      base: 0.10
    farmer:
      enabled: true
      base: 0.08
    hunter:
      enabled: true
      base: 0.35
    fisherman:
      enabled: true
      base: 0.22
    alchemist:
      enabled: false
      base: 0.10
    blacksmith:
      enabled: false
      base: 0.10
  action-multipliers:
    COAL_ORE: 1.3
    DEEPSLATE_COAL_ORE: 1.5
    IRON_ORE: 2.0
    DEEPSLATE_IRON_ORE: 2.2
    COPPER_ORE: 2.0
    GOLD_ORE: 3.0
    DEEPSLATE_GOLD_ORE: 3.3
    REDSTONE_ORE: 3.0
    LAPIS_ORE: 3.0
    DIAMOND_ORE: 8.0
    DEEPSLATE_DIAMOND_ORE: 9.0
    EMERALD_ORE: 8.0
    ANCIENT_DEBRIS: 14.0
    ZOMBIE: 1.6
    SKELETON: 1.6
    CREEPER: 1.8
    SPIDER: 1.5
    ENDERMAN: 3.0
    BLAZE: 3.0
    WITHER_SKELETON: 4.0
    COD: 1.2
    SALMON: 1.2
    PUFFERFISH: 2.0
    TROPICAL_FISH: 2.0

# Anti-abuse: блоки, поставленные игроками, не дают Jobs XP/репутацию для miner/woodcutter.
anti-abuse:
  track-placed-blocks: true
  notify-placed-block: false

# ==========================================
# НОВЫЕ НАВЫКИ (уровень 45)
# ==========================================
advanced-skills:
  miner:
    level: 45
    name: "Сейсморазведчик"
    description: "Видеть руды сквозь стены (10 блоков)"
    effect: "GLOWING на рудах附近"
  woodcutter:
    level: 45
    name: "Древний Лесник"
    description: "Автоматическая рубка дерева (3 блока)"
    effect: "TREE_FELLING"
  farmer:
    level: 45
    name: "Мастер Урожая"
    description: "Мгновенный рост посевов (33% шанс)"
    effect: "INSTANT_GROW"
  alchemist:
    level: 45
    name: "Алхимик Высшего Тира"
    description: "Двойные зелья при варке (25% шанс)"
    effect: "DOUBLE_BREW"
  blacksmith:
    level: 45
    name: "Мастер Ковки"
    description: "+10% к успеху заточки"
    effect: "FORGE_BONUS"
  hunter:
    level: 45
    name: "Повелитель Зверей"
    description: "Дружба с нейтральными мобами"
    effect: "PASSIVE_MOBS"
  fisherman:
    level: 45
    name: "Морской Волк"
    description: "Удвоенный лут из сундуков на кораблях"
    effect: "LOOT_BONUS"

# ==========================================
# ЕЖЕНЕДЕЛЬНЫЕ ЗАДАНИЯ
# ==========================================
weekly-tasks:
  enabled: true
  reset-day: 1                    # Понедельник
  tasks-per-week: 3
  bonus-rep: 500                  # Бонусная репутация за все 3 задания
  tasks:
    - type: "mine"
      target: 500
      description: "Добыть 500 блоков"
      reward-rep: 150
    - type: "kill"
      target: 100
      description: "Убить 100 мобов"
      reward-rep: 200
    - type: "craft"
      target: 50
      description: "Скрафтить 50 предметов"
      reward-rep: 100
    - type: "fish"
      target: 30
      description: "Поймать 30 рыб"
      reward-rep: 120
    - type: "build"
      target: 200
      description: "Поставить 200 блоков"
      reward-rep: 80

# ==========================================
# РЕЙТИНГ ПРОФЕССИЙ
# ==========================================
ranking:
  enabled: true
  broadcast-interval: 86400        # Раз в сутки
  top-count: 10
  rewards:
    1st: 300
    2nd: 200
    3rd: 100
