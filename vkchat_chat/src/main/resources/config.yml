# ═══════════════════════════════════════
# VKChatChat — чат + встроенный TAB
# ═══════════════════════════════════════

format: "{prefix}&r &7{player}&7: &f{message}"

# Каналы
channels:
  local:
    radius: 100

channel-default: "local"

# Антиспам
anti-spam:
  enabled: true
  cooldown-seconds: 2
  max-caps-percent: 70
  max-repeated-chars: 5

# ↕ ВК интеграция
vk:
  enabled: true
  mc-to-vk: true
  vk-to-mc: true
  format-to-vk: "{player}: {message}"
  format-to-mc: "&b[ВК] {player}&7: &f{message}"

# ⏱ Время в сообщениях
timestamps: false

# 🔇 Фильтр чата
chat-filter:
  enabled: false
  words:
    - "badword1"
    - "badword2"

# 🖥 TAB (header/footer + префиксы)
tab:
  header:
    - "&4&l⚔ &c&lCHRDK REBORN &4&l⚔"
    - "&7Добро пожаловать, &f%player%"
    - ""
  footer:
    - ""
    - "&7Онлайн &c%online% &8| &7Репутация &c%vkchat_reputation%"
    - "&7Статус: %luckperms-prefix%"
    - "&7%stats%"
    - ""
    - "&4⚔ &c/donate info &4⚔"
  update-ticks: 20

# 🏷 Форматы join/quit (вариативные)
broadcasts:
  join-messages:
    - "&8[&a+&8] {prefix} &7{player} &7зашёл"
    - "&8[&a+&8] {prefix} &7{player} &7в игре"
  join-new:
    - "&8[&a+&8] {prefix} &7{player} &eвпервые на сервере! &6🌟"
  join-donator:
    - "&8[&a+&8] {prefix} &7{player} &6прибыл"
  join-donator-new:
    - "&8[&a+&8] {prefix} &7{player} &eвпервые и уже донатер! &6👑"
  quit-messages:
    - "&8[&c-&8] {prefix} &7{player} &7вышел"
    - "&8[&c-&8] {prefix} &7{player} &7отключился"
  quit-donator:
    - "&8[&c-&8] {prefix} &7{player} &6ушёл"

  kill-messages:
    - "&c☠ {killer} &7убил &c{victim}"
    - "&c⚔ {killer} &7расправился с &c{victim}"
  death-messages:
    - "&7☠ {player} &7погиб"
    - "&7💀 {player} &7ушёл в мир иной"
  job-level-messages:
    - "&e⭐ {player} &7достиг &e{level} &7уровня профессий!"
