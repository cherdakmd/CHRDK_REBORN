# ═══════════════════════════════════════
# VKChatChat — чат + встроенный TAB
# ═══════════════════════════════════════

format: "{prefix}&r &7{player}&7: &f{message}"

# Каналы
channels:
  local:
    radius: 100

channel-default: "local"

# Антиспам
anti-spam:
  enabled: true
  cooldown-seconds: 2
  max-caps-percent: 70
  max-repeated-chars: 5

# ↕ ВК интеграция
vk:
  enabled: true
  mc-to-vk: true
  vk-to-mc: true
  format-to-vk: "{player}: {message}"
  format-to-mc: "&b[ВК] {player}&7: &f{message}"

# ⏱ Время в сообщениях
timestamps: false

# 🔇 Фильтр чата
chat-filter:
  enabled: false
  words:
    - "badword1"
    - "badword2"

# 🖥 TAB (header/footer + префиксы)
tab:
  header:
    - "&4&l⚔ &c&lCHRDK REBORN &4&l⚔"
    - "&7Добро пожаловать, &f%player%"
    - ""
  footer:
    - ""
    - "&7Онлайн &c%online% &8| &7Репутация &c%vkchat_reputation%"
    - "&7Статус: %luckperms-prefix%"
    - "&7%stats%"
    - ""
    - "&4⚔ &c/donate info &4⚔"
  update-ticks: 20

# 🏷 Форматы join/quit
join-format: "&8[&a+&8] {prefix} &7{player}"
quit-format: "&8[&c-&8] {prefix} &7{player}"
