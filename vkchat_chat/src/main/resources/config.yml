# ═══════════════════════════════════════
# VKChatChat — чат + встроенный TAB
# ═══════════════════════════════════════

format: "{prefix}&r &7{player}&7: &f{message}"

# Каналы
channels:
  local:
    radius: 100

channel-default: "local"

# Антиспам
anti-spam:
  enabled: true
  cooldown-seconds: 2
  max-caps-percent: 70
  max-repeated-chars: 5

# ↕ ВК интеграция
vk:
  enabled: true
  mc-to-vk: true
  vk-to-mc: true
  format-to-vk: "{player}: {message}"
  format-to-mc: "&b[ВК] {player}&7: &f{message}"

# ⏱ Время в сообщениях
timestamps: false

# 🔇 Фильтр чата
chat-filter:
  enabled: false
  words:
    - "badword1"
    - "badword2"

# 🖥 TAB (header/footer + префиксы)
tab:
  header:
    - "&4&l⚔ &c&lCHRDK REBORN &4&l⚔"
    - "&7Добро пожаловать, &f%player%"
    - ""
  footer:
    - ""
    - "&7Онлайн &c%online% &8| &7Репутация &c%vkchat_reputation%"
    - "&7Статус: %luckperms-prefix%"
    - "&7%stats%"
    - ""
    - "&4⚔ &c/donate info &4⚔"
  update-ticks: 20

# 🏷 Форматы join/quit (вариативные)
broadcasts:
  # Вход — обычные игроки
  join-messages:
    - "&8[&a+&8] {prefix} &7{player} &7зашёл на сервер"
    - "&8[&a+&8] {prefix} &7{player} &7появился"
    - "&8[&a+&8] {prefix} &7{player} &7в игре"
    - "&8[&a+&8] {prefix} &7{player} &7присоединился"
    - "&8[&a+&8] {prefix} &7{player} &7тут"
  # Вход — новый игрок
  join-new:
    - "&8[&a+&8] {prefix} &7{player} &eвпервые на сервере! &6🎉"
    - "&8[&a+&8] {prefix} &7{player} &eприсоединился впервые! &6🌟"
    - "&8[&a+&8] {prefix} &7{player} &eновый игрок! &6Добро пожаловать!"
  # Вход — донатер
  join-donator:
    - "&8[&a+&8] {prefix} &7{player} &6зашёл с сиянием"
    - "&8[&a+&8] {prefix} &7{player} &6почтил сервер присутствием"
    - "&8[&a+&8] {prefix} &7{player} &6прибыл"
  # Вход — новый донатер
  join-donator-new:
    - "&8[&a+&8] {prefix} &7{player} &eвпервые здесь и уже донатер! &6👑"
    - "&8[&a+&8] {prefix} &7{player} &eновый донатер на сервере! &6💎"
  # Выход — обычный
  quit-messages:
    - "&8[&c-&8] {prefix} &7{player} &7вышел"
    - "&8[&c-&8] {prefix} &7{player} &7покинул сервер"
    - "&8[&c-&8] {prefix} &7{player} &7ушёл"
    - "&8[&c-&8] {prefix} &7{player} &7отключился"
  # Выход — донатер
  quit-donator:
    - "&8[&c-&8] {prefix} &7{player} &6ушёл по делам"
    - "&8[&c-&8] {prefix} &7{player} &6покинул нас"
    - "&8[&c-&8] {prefix} &7{player} &6ушёл в закат"

  kill-messages:
    - "&c☠ {killer} &7отправил &c{victim} &7на респаун"
    - "&c⚔ {killer} &7расправился с &c{victim}"
    - "&c💀 {killer} &7убил &c{victim}"
    - "&c🗡 {killer} &7победил &c{victim} &7в бою"
    - "&c🔥 {killer} &7уничтожил &c{victim}"
  death-messages:
    - "&7☠ {player} &7погиб"
    - "&7💀 {player} &7ушёл в мир иной"
    - "&7🪦 {player} &7отправился на тот свет"
    - "&7⚰ {player} &7встретил смерть"
    - "&7🕯 {player} &7пал в бою"
  job-level-messages:
    - "&e⭐ {player} &7достиг &e{level} &7уровня профессий!"
    - "&e📈 {player} &7прокачал профессии до &e{level}"
    - "&e🏆 {player} &7— &e{level} &7уровень Jobs!"
