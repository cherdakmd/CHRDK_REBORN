<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CHRDK REBORN — RPG Minecraft ↔ VK</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Официальная вики сервера CHRDK REBORN: RPG-экосистема Minecraft ↔ ВКонтакте. Нации, Gear, Jobs, Events, Offline DnD.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f1c40f' d='M5 16L3 5l5.5 4L12 4l3.5 5L21 5l-2 11H5zm0 2h14v2H5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --gold:#f1c40f;
      --gold-2:#e6b800;
      --crimson:#c0392b;
      --bg:#0a0b0f;
      --bg-2:#111319;
      --side:#0d0e14;
      --txt:#eef0f5;
      --txt-dim:#9aa0b0;
      --txt-mute:#6a6f7e;
      --theme-color:var(--gold);
      --base-bg-color:var(--bg);
    }
    html,body{background:var(--bg)!important;color:var(--txt)!important}
    body{
      font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif!important;
      background:
        radial-gradient(55vw 55vw at 12% 4%,rgba(241,196,15,.06),transparent 60%),
        radial-gradient(50vw 50vw at 92% 96%,rgba(192,57,43,.08),transparent 60%) fixed;
    }
    body .sidebar{
      background:var(--side)!important;
      border-right:1px solid rgba(241,196,15,.12);
      padding-top:0;
    }
    body .sidebar .sidebar-name{
      font-family:'Oswald',sans-serif!important;
      font-weight:700;letter-spacing:1px;
      background:linear-gradient(100deg,#fff,var(--gold));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      font-size:1.05rem;
    }
    body .sidebar>h1 .app-nav{display:none}
    body .sidebar ul{margin:0}
    body .sidebar li{margin:0}
    body .sidebar ul li a{
      color:var(--txt-dim)!important;
      font-size:14px;font-weight:500;
      border-left:2px solid transparent;
      padding:9px 14px!important;
      transition:.2s;
      line-height:1.45;
    }
    body .sidebar ul li a:hover{
      color:var(--txt)!important;
      background:rgba(241,196,15,.05);
      border-left-color:var(--gold);
    }
    body .sidebar ul li.active>a{
      color:var(--gold)!important;
      background:rgba(241,196,15,.08);
      border-left-color:var(--gold);
      font-weight:700;
    }
    body .sidebar ul>li>strong,body .sidebar>p>strong{
      color:var(--txt-mute);
      font-size:11px!important;
      text-transform:uppercase;
      letter-spacing:2px;
      font-weight:700;
      padding:18px 14px 8px;
      display:block;
    }
    body .content,body .markdown-section{
      background:transparent!important;
      color:var(--txt)!important;
      max-width:880px;
      padding:40px 52px 80px;
    }
    .markdown-section h1,.markdown-section h2,.markdown-section h3,.markdown-section h4{
      font-family:'Oswald',sans-serif!important;
      color:var(--txt)!important;
      border-bottom-color:rgba(241,196,15,.16)!important;
      letter-spacing:.5px;
    }
    .markdown-section h1{
      background:linear-gradient(100deg,#fff 20%,var(--gold));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      font-size:2.3rem;text-transform:uppercase;letter-spacing:1px;
    }
    .markdown-section h2{font-size:1.7rem;text-transform:uppercase;margin-top:1.6em}
    .markdown-section h3{font-size:1.25rem;text-transform:none;color:var(--gold)!important}
    .markdown-section p,.markdown-section li{color:var(--txt-dim)!important;font-size:15px;line-height:1.75}
    .markdown-section strong{color:var(--txt)!important}
    .markdown-section a{color:var(--gold)!important;border-bottom:1px dashed rgba(241,196,15,.4)}
    .markdown-section a:hover{color:var(--gold-2)!important;border-bottom-style:solid}
    .markdown-section code{
      background:rgba(241,196,15,.1)!important;
      color:var(--gold)!important;
      border:1px solid rgba(241,196,15,.18);
      border-radius:6px;
      padding:2px 7px!important;
      font-size:13.5px;
      font-family:'JetBrains Mono','SF Mono',Consolas,monospace;
    }
    .markdown-section pre{
      background:var(--bg-2)!important;
      border:1px solid rgba(255,255,255,.08);
      border-radius:11px;
      padding:18px 20px!important;
      box-shadow:0 12px 30px rgba(0,0,0,.4);
    }
    .markdown-section pre>code{
      background:transparent!important;border:0;color:#c8ccd6!important;
      padding:0!important;font-size:13.5px;line-height:1.7;
    }
    .markdown-section table{
      display:table;width:100%;
      background:var(--bg-2);
      border:1px solid rgba(255,255,255,.08);
      border-radius:11px;overflow:hidden;
      box-shadow:0 12px 30px rgba(0,0,0,.3);
    }
    .markdown-section table th{
      background:rgba(241,196,15,.1)!important;
      color:var(--gold)!important;
      font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.6px;
      font-size:13px;border:0!important;padding:13px 16px!important;
    }
    .markdown-section table td{
      border:0!important;border-top:1px solid rgba(255,255,255,.06)!important;
      padding:12px 16px!important;color:var(--txt-dim)!important;font-size:14px;
    }
    .markdown-section table tr:hover td{background:rgba(241,196,15,.04)}
    .markdown-section blockquote{
      background:linear-gradient(135deg,rgba(241,196,15,.08),rgba(192,57,43,.06));
      border-left:3px solid var(--gold);
      border-radius:0 11px 11px 0;
      padding:14px 20px!important;
      color:var(--txt)!important;
      margin:1.4em 0;
    }
    .markdown-section blockquote p{color:var(--txt)!important}
    .markdown-section hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:2em 0}
    .markdown-section ul,.markdown-section ol{padding-left:22px}
    .markdown-section ul li::marker{color:var(--gold)}
    .markdown-section ol li::marker{color:var(--gold);font-weight:700}
    body .search input{
      background:var(--bg-2)!important;color:var(--txt)!important;
      border:1px solid rgba(255,255,255,.1);border-radius:8px;
      padding:9px 12px!important;
    }
    body .search input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(241,196,15,.15)}
    body .sidebar-toggle{background:var(--side)!important;border-bottom:1px solid rgba(241,196,15,.12)}
    body .sidebar-toggle span{background:var(--gold)!important}
    ::-webkit-scrollbar{width:11px;height:11px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:rgba(241,196,15,.22);border-radius:10px;border:3px solid var(--bg)}
    ::-webkit-scrollbar-thumb:hover{background:rgba(241,196,15,.4)}
    .totop{
      position:fixed;bottom:24px;right:24px;width:46px;height:46px;border-radius:12px;
      background:linear-gradient(135deg,var(--gold),var(--gold-2));
      color:#0a0b0f;display:grid;place-items:center;cursor:pointer;z-index:60;
      box-shadow:0 8px 24px rgba(241,196,15,.35);
      opacity:0;transform:translateY(20px);transition:.3s;border:0;
    }
    .totop.show{opacity:1;transform:none}
    .totop:hover{transform:translateY(-3px)}
    body .sidebar .app-name-link{padding:18px 24px;display:block}
  </style>
</head>
<body>
  <div id="app">CHRDK REBORN — RPG Minecraft ↔ VK</div>
  <button class="totop" id="toTop" onclick="document.documentElement.scrollTop=0" title="Наверх">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <script>
    window.$docsify = {
      name: 'CHRDK REBORN',
      logoText: 'RPG Minecraft ↔ VK',
      repo: 'https://github.com/cherdakmd/CHRDK_REBORN',
      loadSidebar: true,
      autoHeader: false,
      mergeNavbar: true,
      maxLevel: 3,
      subMaxLevel: 3,
      coverpage: false,
      externalLinkTarget: '_blank',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Поиск...',
        noData: 'Ничего не найдено!',
        depth: 6
      },
      themeColor: '#f1c40f'
    };
    window.addEventListener('scroll', function(){
      var b = document.getElementById('toTop');
      if(document.documentElement.scrollTop > 400) b.classList.add('show');
      else b.classList.remove('show');
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
