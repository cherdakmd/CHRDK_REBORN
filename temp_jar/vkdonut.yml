# ==========================================
#  НАСТРОЙКИ VK DONUT (Платные подписки)
# ==========================================
enabled: false             # Включить модуль VK Donut
check-interval: 3600       # Интервал проверки подписок (в секундах)

# Команды, которые выполняются от имени консоли (Сервера)
# Доступные переменные:
# {uuid} - UUID игрока
# {player} - Никнейм игрока (может быть null, если игрок давно не заходил)

on-subscribe:
  - "lp user {uuid} parent add vip"
  - "give {player} diamond 10"
  - "vkchat wall Игрок {player} только что оформил платную подписку VK Donut! Спасибо за поддержку!"

on-unsubscribe:
  - "lp user {uuid} parent remove vip"
