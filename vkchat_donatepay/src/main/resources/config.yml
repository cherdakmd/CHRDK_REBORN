# ==========================================
# VKChatDonatePay — интеграция с donatepay.ru
# ==========================================

enabled: false
donate-url: "https://donatepay.ru/"

api:
  # Вставьте API token DonatePay. Не публикуйте его в GitHub.
  access-token: "PUT_DONATEPAY_TOKEN_HERE"
  base-url: "https://donatepay.ru/api/v1"
  # DonatePay просит не делать API-операции чаще 1 раза в 20 секунд.
  poll-interval-seconds: 30
  request-timeout-ms: 10000
  limit: 25
  order: "DESC"
  type: "donation"
  status: "success"

processing:
  # true = при первом запуске запомнить текущий последний донат и не выдавать награды за старые.
  ignore-existing-on-first-run: true
  require-player: false
  # Где искать ник Minecraft: vars.name, comment или оба поля.
  player-source: "name" # name / comment / both
  # Regex для ника Minecraft. Первая группа считается ником.
  player-regex: "([A-Za-z0-9_]{3,16})"
  # Если игрок оффлайн, команды всё равно выполнятся с плейсхолдером {player}, если ник найден.
  allow-offline-player: true
  queue-offline-commands: true
  queue-offline-messages: true

# 4 месячных статуса донатеров.
# Статус покупается донатом на сумму price и действует duration-days.
donor-statuses:
  enabled: true
  # Статусы покупаются донатом на сумму price и выдаются строго на duration-days.
  mode: "monthly"
  none-name: "без статуса"
  vk-announce: true
  upgrade-message: "&d❤ &f{player} получил DonatePay-статус {status}&f на {duration}! Цена статуса: &e{price}₽"
  extend-message: "&d❤ &f{player} продлил DonatePay-статус {status}&f ещё на &e{duration}&f!"
  keep-higher-message: "&e❤ У вас уже активен более высокий статус {status}&e. Донат засчитан, статус не понижен."
  vk-announce-extensions: false
  levels:
    spark:
      name: "&aИскра"
      price: 100
      duration-days: 30
      reputation-multiplier: 2.00
      description:
        - "&7Базовый донатерский статус на месяц."
        - "&a+100% &7репутации за донаты, x10 усиленный шанс доп. добычи."
      effects:
        mob-rep-bonus: 10
        mining-extra-drop-chance: 30
        mob-extra-drop-chance: 30
        exp-multiplier: 1.50
        potion-effects:
          - "FAST_DIGGING;0"
      commands-on-purchase:
        - "lp user {player} parent remove donate_spark"
        - "lp user {player} parent remove donate_flame"
        - "lp user {player} parent remove donate_star"
        - "lp user {player} parent remove donate_legend"
        - "lp user {player} parent addtemp donate_spark {duration}"
        - "give {player} emerald 40"
    flame:
      name: "&bПламя"
      price: 500
      duration-days: 30
      reputation-multiplier: 3.50
      description:
        - "&7Усиленный статус на месяц."
        - "&b+250% &7репутации за донаты, x10 усиленная добыча и опыт."
      effects:
        mob-rep-bonus: 20
        mining-extra-drop-chance: 60
        mob-extra-drop-chance: 60
        exp-multiplier: 2.00
        potion-effects:
          - "FAST_DIGGING;0"
          - "SPEED;0"
      commands-on-purchase:
        - "lp user {player} parent remove donate_spark"
        - "lp user {player} parent remove donate_flame"
        - "lp user {player} parent remove donate_star"
        - "lp user {player} parent remove donate_legend"
        - "lp user {player} parent addtemp donate_flame {duration}"
        - "give {player} diamond 30"
        - "xp add {player} 50 levels"
    star:
      name: "&dЗвезда"
      price: 1500
      duration-days: 30
      reputation-multiplier: 6.00
      description:
        - "&7Премиальный статус на месяц."
        - "&d+500% &7репутации за донаты, гарантированная доп. добыча и мощный опыт."
      effects:
        mob-rep-bonus: 40
        mining-extra-drop-chance: 100
        mob-extra-drop-chance: 100
        exp-multiplier: 3.00
        potion-effects:
          - "FAST_DIGGING;1"
          - "SPEED;0"
          - "LUCK;0"
      commands-on-purchase:
        - "lp user {player} parent remove donate_spark"
        - "lp user {player} parent remove donate_flame"
        - "lp user {player} parent remove donate_star"
        - "lp user {player} parent remove donate_legend"
        - "lp user {player} parent addtemp donate_star {duration}"
        - "give {player} diamond 80"
        - "give {player} golden_apple 20"
        - "xp add {player} 100 levels"
    legend:
      name: "&6&lЛегенда"
      price: 5000
      duration-days: 30
      reputation-multiplier: 11.00
      description:
        - "&7Максимальный статус поддержки на месяц."
        - "&6x11 &7репутации за донаты, 150% доп. добычи/лута и максимальный опыт."
      effects:
        mob-rep-bonus: 80
        mining-extra-drop-chance: 150
        mob-extra-drop-chance: 150
        exp-multiplier: 4.50
        potion-effects:
          - "FAST_DIGGING;1"
          - "SPEED;1"
          - "LUCK;1"
          - "DAMAGE_RESISTANCE;0"
      commands-on-purchase:
        - "lp user {player} parent remove donate_spark"
        - "lp user {player} parent remove donate_flame"
        - "lp user {player} parent remove donate_star"
        - "lp user {player} parent remove donate_legend"
        - "lp user {player} parent addtemp donate_legend {duration}"
        - "give {player} netherite_ingot 10"
        - "give {player} diamond_block 5"
        - "give {player} enchanted_golden_apple 5"
        - "xp add {player} 200 levels"

# ==========================================
# VIP-КОМАНДЫ ДЛЯ ДОНАТЕРОВ
# ==========================================
vip-commands:
  enabled: true
  spark:
    - "/fly 30"           # Полёт на 30 сек
    - "/heal"             # Лечение
    - "/feed"             # Насыщение
  flame:
    - "/fly 60"
    - "/heal"
    - "/feed"
    - "/speed 2 30"       # Спешка на 30 сек
    - "/enderchest"       # Эндер-чехст
  star:
    - "/fly 120"
    - "/heal"
    - "/feed"
    - "/speed 2 60"
    - "/enderchest"
    - "/repair"           # Починка предмета в руке
    - "/god 30"           # Неуязвимость на 30 сек
  legend:
    - "/fly unlimited"
    - "/heal"
    - "/feed"
    - "/speed 3 unlimited"
    - "/enderchest"
    - "/repair all"       # Починка всего инвентаря
    - "/god 60"
    - "/broadcast"        # Объявление в чат (КД 1 час)
        - "give {player} netherite_scrap 40"
        - "give {player} enchanted_golden_apple 10"
        - "xp add {player} 250 levels"

rewards:
  # Репутация ВК за 1 рубль доната. Выдаётся только если игрок найден и привязан к ВК.
  reputation-per-rub: 10
  min-reputation: 0
  round-reputation: true
  broadcast: true
  vk-announce: true
  broadcast-format: "&d❤ &f{donator} поддержал сервер на &e{amount}₽&f! {player_part}"
  player-part-format: "&7Игрок: &a{player}&7."

  # Команды выполняются от консоли, если сумма доната >= min-amount.
  # Плейсхолдеры: {player}, {donator}, {amount}, {amount_int}, {comment}, {id}
  actions:
    small:
      min-amount: 50
      commands:
        - "give {player} emerald 30"
      message-player:
        - "&aСпасибо за поддержку! Донат: &e{amount}₽&a."
    medium:
      min-amount: 200
      commands:
        - "give {player} diamond 20"
        - "xp add {player} 50 levels"
      message-player:
        - "&d❤ Спасибо за донат &e{amount}₽&d! Выдан бонус среднего уровня."
    big:
      min-amount: 500
      commands:
        - "give {player} diamond 60"
        - "give {player} golden_apple 20"
      message-player:
        - "&6❤ Огромное спасибо за поддержку на &e{amount}₽&6!"
      broadcast: "&6❤ {donator} сделал крупный донат: &e{amount}₽&6!"

logging:
  file: true
  file-name: "donatepay.log"
  debug: false

# Автосоздание LuckPerms-групп для DonatePay-статусов.
# Команда: /donatepay lpsetup
luckperms:
  setup-commands:
    # Базовая группа сервера
    - "lp creategroup default"
    - "lp group default meta setprefix 0 &8[&7Игрок&8] &7"
    - "lp group default permission set vkchat.player true"
    - "lp group default permission set vkchat.teleport.player true"
    - "lp group default permission set vkchat.market.player true"
    - "lp group default permission set vkchat.jobs.player true"
    - "lp group default permission set vkchat.gear.player true"
    - "lp group default permission set vkchat.artifacts.player true"
    - "lp group default permission set vkchat.nations.player true"
    - "lp group default permission set vkchat.offline.player true"
    - "lp group default permission set vkchat.events.player true"

    # DonatePay-группы
    - "lp creategroup donate_spark"
    - "lp creategroup donate_flame"
    - "lp creategroup donate_star"
    - "lp creategroup donate_legend"

    # Наследование: каждый следующий статус включает бонусы предыдущего.
    - "lp group donate_flame parent add donate_spark"
    - "lp group donate_star parent add donate_flame"
    - "lp group donate_legend parent add donate_star"

    # Вес групп. Чем выше статус, тем выше вес.
    - "lp group donate_spark setweight 20"
    - "lp group donate_flame setweight 30"
    - "lp group donate_star setweight 40"
    - "lp group donate_legend setweight 50"

    # Префиксы для TAB / чата. Если TAB groups.yml использует эти группы, будет единый стиль.
    - "lp group donate_spark meta setprefix 100 &8[&aИскра&8] &a"
    - "lp group donate_flame meta setprefix 110 &8[&bПламя&8] &b"
    - "lp group donate_star meta setprefix 120 &8[&dЗвезда&8] &d"
    - "lp group donate_legend meta setprefix 130 &8[&6&lЛегенда&8] &6"

    # Базовый доступ к системам сервера.
    - "lp group donate_spark permission set vkchat.player true"
    - "lp group donate_spark permission set vkchat.teleport.player true"
    - "lp group donate_spark permission set vkchat.market.player true"
    - "lp group donate_spark permission set vkchat.jobs.player true"
    - "lp group donate_spark permission set vkchat.gear.player true"
    - "lp group donate_spark permission set vkchat.artifacts.player true"
    - "lp group donate_spark permission set vkchat.nations.player true"
    - "lp group donate_spark permission set vkchat.offline.player true"
    - "lp group donate_spark permission set vkchat.events.player true"
    - "lp group donate_spark permission set vkchat.donate.status.spark true"
    - "lp group donate_flame permission set vkchat.donate.status.flame true"
    - "lp group donate_star permission set vkchat.donate.status.star true"
    - "lp group donate_legend permission set vkchat.donate.status.legend true"

    # Бонусы нашего комплекса плагинов. Их читают VKChat-модули напрямую.
    - "lp group donate_spark permission set vkchat.donate.jobs.spark true"
    - "lp group donate_flame permission set vkchat.donate.jobs.flame true"
    - "lp group donate_star permission set vkchat.donate.jobs.star true"
    - "lp group donate_legend permission set vkchat.donate.jobs.legend true"

    - "lp group donate_spark permission set vkchat.donate.gear.spark true"
    - "lp group donate_flame permission set vkchat.donate.gear.flame true"
    - "lp group donate_star permission set vkchat.donate.gear.star true"
    - "lp group donate_legend permission set vkchat.donate.gear.legend true"

    - "lp group donate_spark permission set vkchat.donate.market.spark true"
    - "lp group donate_flame permission set vkchat.donate.market.flame true"
    - "lp group donate_star permission set vkchat.donate.market.star true"
    - "lp group donate_legend permission set vkchat.donate.market.legend true"

    - "lp group donate_spark permission set vkchat.donate.teleport.spark true"
    - "lp group donate_flame permission set vkchat.donate.teleport.flame true"
    - "lp group donate_star permission set vkchat.donate.teleport.star true"
    - "lp group donate_legend permission set vkchat.donate.teleport.legend true"

    - "lp group donate_spark permission set vkchat.donate.offline.spark true"
    - "lp group donate_flame permission set vkchat.donate.offline.flame true"
    - "lp group donate_star permission set vkchat.donate.offline.star true"
    - "lp group donate_legend permission set vkchat.donate.offline.legend true"


stats:
  history-limit: 80

goals:
  enabled: false
  donate-url: "https://donatepay.ru/"
  monthly-target: 5000
  announce-every-percent: 25
  progress-message: "&d❤ Цель донатов: &e{current}&7/&6{target}₽ &f({percent}%)"
  complete-message: "&6❤ Месячная цель донатов выполнена: &e{current}&7/&6{target}₽&6! Спасибо за поддержку!"
