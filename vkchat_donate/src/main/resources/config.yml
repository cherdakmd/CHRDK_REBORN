# ═══════════════════════════════════════
# VKChatDonate — система донатов через DonatePay
# ═══════════════════════════════════════

# Токен API DonatePay
# Где получить: donatepay.ru → Мои кассы → выберите кассу →
#   Настройки → API → скопируйте "API-токен"
api-token: "YOUR_DONATEPAY_TOKEN"

# Интервал проверки новых донатов (секунды)
poll-interval: 30

# Рассылка о донатах в чат и ВК
broadcasts:
  enabled: true

# ═══════════════════════════════════════
# ДОНАТ-СТАТУСЫ (5 уровней)
# ═══════════════════════════════════════
# Каждый статус выдаёт LuckPerms permission: vkchat.donate.<id>
# Игрок указывается в ИМЕНИ отправителя доната! (поле «Ваше имя» на странице доната)
statuses:

  spark:
    id: "spark"
    name: "&b⚡ Искра"
    display: "⚡ Искра"
    prefix: "&b⚡"
    weight: 1
    price: 250
    description: "Начальный донат-статус"
    # Множители и бонусы
    rep-discount: 0.10       # -10% к ценам в репутации
    tp-cooldown-mult: 0.80   # КД телепортов ×0.8
    max-homes: 5
    market-mult: 1.10        # +10% к продаже на рынке
    jobs-xp-mult: 1.10       # +10% XP профессий

  flame:
    id: "flame"
    name: "&6🔥 Пламя"
    display: "🔥 Пламя"
    prefix: "&6🔥"
    weight: 2
    price: 500
    description: "Средний донат-статус"
    rep-discount: 0.20
    tp-cooldown-mult: 0.65
    max-homes: 8
    market-mult: 1.20
    jobs-xp-mult: 1.20

  star:
    id: "star"
    name: "&e⭐ Звезда"
    display: "⭐ Звезда"
    prefix: "&e⭐"
    weight: 3
    price: 1000
    description: "Продвинутый донат-статус"
    rep-discount: 0.35
    tp-cooldown-mult: 0.50
    max-homes: 12
    market-mult: 1.35
    jobs-xp-mult: 1.35

  legend:
    id: "legend"
    name: "&5👑 Легенда"
    display: "👑 Легенда"
    prefix: "&5👑"
    weight: 4
    price: 2500
    description: "Элитный донат-статус"
    rep-discount: 0.50
    tp-cooldown-mult: 0.30
    max-homes: 20
    market-mult: 1.50
    jobs-xp-mult: 1.50

  overlord:
    id: "overlord"
    name: "&d💎 Властелин"
    display: "💎 Властелин"
    prefix: "&d💎"
    weight: 5
    price: 5000
    description: "Максимальный донат-статус"
    rep-discount: 0.65
    tp-cooldown-mult: 0.15
    max-homes: 30
    market-mult: 1.70
    jobs-xp-mult: 1.70

# ═══════════════════════════════════════
# СООБЩЕНИЯ
# ═══════════════════════════════════════
messages:
  donate-broadcast-mc: "&6💰 &e{player} &6получил статус {status} &6за донат!"
  donate-broadcast-vk: "💰 {player} получил статус {status} за донат!"
  donate-thanks: "&a✨ Спасибо за донат, {player}! Статус {status} активирован на 30 дней."
