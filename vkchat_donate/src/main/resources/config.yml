# ═══════════════════════════════════════
# VKChatDonate v3.1 — система донатов через DonatePay
# ═══════════════════════════════════════

config-version: 4

# Токен API DonatePay
# Где получить: donatepay.ru → Мои кассы → Настройки → API
api-token: "YOUR_DONATEPAY_TOKEN"

# Ссылка на страницу доната (показывается в /donate info и сообщениях)
# Оставь пустым чтобы скрыть
donate-page-url: ""

# Интервал проверки новых донатов (секунды)
# Используется только если webhook.enabled=false
poll-interval: 30

# ═══════════════════════════════════════
# WEBHOOK — мгновенная обработка донатов
# ═══════════════════════════════════════
# Если включён, заменяет polling. Донаты обрабатываются мгновенно.
# DonatePay → POST http://<your-ip>:8080/webhook/donate
# Header: X-Webhook-Secret: <your-secret>
webhook:
  enabled: false
  port: 8080
  secret: "CHANGE_ME_TO_A_RANDOM_STRING"

# Длительность донат-статуса в днях
donation-duration-days: 30

# Рассылка о донатах в чат и ВК
broadcasts:
  enabled: true

# ═══════════════════════════════════════
# ПРОХОДКА (без ВК) — v3.1 расширенная
# ═══════════════════════════════════════
pass:
  price: 500                    # Минимальная сумма для проходки
  duration-days: 30             # PASS_FIX #5: Отдельная длительность (отличается от донат-статуса)
  grace-days: 3                 # PASS_IMPROVE #5: Льготный период после истечения (дни)
  local-rep-cap: 50000          # PASS_FIX #7: Максимум локальной репутации для проходочников
  auto-convert-on-vk-link: true # PASS_IMPROVE #3: Автоконвертация при привязке ВК

# ═══════════════════════════════════════
# ДОНАТ-СТАТУСЫ (5 уровней)
# ═══════════════════════════════════════
# Каждый статус выдаёт LuckPerms permission: vkchat.donate.<id>
# Игрок указывается в ИМЕНИ отправителя доната!
statuses:

  spark:
    id: "spark"
    name: "&b⚡ Искра"
    display: "⚡ Искра"
    prefix: "&b&lИСКРА&r"
    weight: 1
    price: 250
    description: "Начальный донат-статус"
    rep-discount: 0.10
    tp-cooldown-mult: 0.80
    max-homes: 5
    market-mult: 1.10
    jobs-xp-mult: 1.10

  flame:
    id: "flame"
    name: "&6🔥 Пламя"
    display: "🔥 Пламя"
    prefix: "&6&lПЛАМЯ&r"
    weight: 2
    price: 500
    description: "Средний донат-статус"
    rep-discount: 0.20
    tp-cooldown-mult: 0.65
    max-homes: 8
    market-mult: 1.20
    jobs-xp-mult: 1.20

  star:
    id: "star"
    name: "&e⭐ Звезда"
    display: "⭐ Звезда"
    prefix: "&e&lЗВЕЗДА&r"
    weight: 3
    price: 1000
    description: "Продвинутый донат-статус"
    rep-discount: 0.35
    tp-cooldown-mult: 0.50
    max-homes: 12
    market-mult: 1.35
    jobs-xp-mult: 1.35

  legend:
    id: "legend"
    name: "&5👑 Легенда"
    display: "👑 Легенда"
    prefix: "&5&lЛЕГЕНДА&r"
    weight: 4
    price: 2500
    description: "Элитный донат-статус"
    rep-discount: 0.50
    tp-cooldown-mult: 0.30
    max-homes: 20
    market-mult: 1.50
    jobs-xp-mult: 1.50

  overlord:
    id: "overlord"
    name: "&d💎 Властелин"
    display: "💎 Властелин"
    prefix: "&d&lВЛАСТЕЛИН&r"
    weight: 5
    price: 5000
    description: "Максимальный донат-статус"
    rep-discount: 0.65
    tp-cooldown-mult: 0.15
    max-homes: 30
    market-mult: 1.70
    jobs-xp-mult: 1.70

# ═══════════════════════════════════════
# СБОР СРЕДСТВ (BossBar)
# ═══════════════════════════════════════
fundraiser:
  enabled: false
  goal: 10000
  bar-color: "PURPLE"
  bar-text: "&d💰 Сбор средств: &f{collected}₽ &7/ &f{goal}₽ &a({percent}%)"

# ═══════════════════════════════════════
# ПОКУПКА РЕПУТАЦИИ (1₽ = N реп)
# ═══════════════════════════════════════
rep-purchase:
  enabled: true
  rate: 100                 # 1₽ = 100 реп
  max-without-status: 0     # 0 = любая сумма → реп

# ═══════════════════════════════════════
# НАСТРАИВАЕМЫЕ СООБЩЕНИЯ
# Переменные: {player}, {status}, {amount}, {rub}, {days}
# ═══════════════════════════════════════
messages:
  # Донат-статусы
  donate-broadcast-mc: "&6💰 &e{player} &6получил статус {status} &6за донат!"
  extend-broadcast-mc: "&6💰 &e{player} &6продлил статус {status} &6за донат!"
  donate-broadcast-vk: "💰 {player} получил статус {status} за донат!"
  extend-broadcast-vk: "💰 {player} продлил статус {status} за донат!"
  donate-thanks: "&a✨ Спасибо за донат! Статус {status} &aактивен на {days} дней."
  rep-broadcast-mc: "&6💰 &e{player} &6пополнил баланс на &e{amount} реп. &6за &e{rub}₽"

  # Проходка (PASS_IMPROVE #7)
  pass-broadcast-mc: "&6🎫 &e{player} &6приобрёл проходку! &aДобро пожаловать!"
  pass-grant: "&a🎫 Проходка активирована на {days} дней! Добро пожаловать на сервер!"
  pass-info: "&7Локальная репутация: /pass rep | Привяжите ВК: /vklink"
  pass-expiring: "&e⚠ Ваша проходка истекает через {days} дн.!"
  pass-expired: "&c⚠ Ваша проходка истекла! Привяжите ВК: /vklink"
  pass-grace: "&e⏰ Проходка истекла! Льготный период: ещё {hours} ч."
  pass-converted: "&a🎫→🔗 Проходка заменена привязкой ВК! Локальная репутация перенесена."

  # Статусы
  status-expiring: "&e⚠ Ваш статус {status} &eистекает через {days} дн.!"
  status-expired: "&c⚠ Ваш донат-статус {status} &cистёк! Продлите через донат."
