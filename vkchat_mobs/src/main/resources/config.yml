# ==========================================
#  ДИНАМИЧЕСКОЕ УСИЛЕНИЕ МОБОВ (VKChat Mobs)
# ==========================================
config-version: 1
settings:
  enabled: true
  search-radius: 64.0

# ==========================================
#  ФОРМУЛА СЛОЖНОСТИ
# ==========================================
difficulty:
  rank-divider: 25.0
  max-multiplier: 10.0
  show-health-nameplate: true

# ==========================================
# ⚔ ХАРАКТЕРИСТИКИ УСИЛЕНИЯ
# ==========================================
scaling:
  health: true
  damage: true
  speed: false
  affect-spawners: false
  super-boss-spawn-chance: 2.0
  super-boss-cooldown-ms: 600000

# ==========================================
#  СТИХИИ
# ==========================================
elements:
  ice:
    name: "Лёд"
    color: "§b"
    damage-bonus: 0.15
    particle: SNOWFLAKE
  blood:
    name: "Кровь"
    color: "§4"
    damage-bonus: 0.20
    particle: DAMAGE_INDICATOR
  wind:
    name: "Ветер"
    color: "§7"
    damage-bonus: 0.10
    particle: CLOUD
    effects:
      knockback: 1.5
      speed-duration-ticks: 60
  earth:
    name: "Земля"
    color: "§6"
    damage-bonus: 0.12
    particle: BLOCK_DUST
    effects:
      slowness-duration-ticks: 80
      resistance-duration-ticks: 100
  crystal:
    name: "Кристалл"
    color: "§d"
    damage-bonus: 0.18
    particle: END_ROD
    effects:
      reflect-chance: 20
      reflect-percent: 30

# ==========================================
#  АРХЕТИПЫ
# ==========================================
archetypes:
  paladin:
    name: "Паладин"
    description: "Святой воин, карающий нежить"
    bonus-health: 20
    bonus-damage: 5
    ability: "holy_smite"
  ranger:
    name: "Следопыт"
    description: "Мастер дальнего боя и выживания"
    bonus-health: 10
    bonus-damage: 8
    ability: "precision_shot"
  alchemist:
    name: "Алхимик"
    description: "Мастер зелий и ядов"
    bonus-health: 15
    bonus-damage: 3
    ability: "potion_throw"
    effects:
      poison-duration-ticks: 100
      weakness-duration-ticks: 80
  summoner:
    name: "Призыватель"
    description: "Призывает союзников на поле боя"
    bonus-health: 25
    bonus-damage: 0
    ability: "summon_minions"
    effects:
      summon-count: 3
      summon-type: "ZOMBIE"
  guardian:
    name: "Страж"
    description: "Защищает ближайших мобов"
    bonus-health: 40
    bonus-damage: -3
    ability: "protect_allies"
    effects:
      protection-radius: 8
      damage-reduction-percent: 25

# ==========================================
#  ОСАДА (SIEGE)
# ==========================================
siege:
  enabled: true
  wave-interval-seconds: 300
  max-waves: 5
  wave-base-count: 4        # База монстров в волне
  wave-per-wave: 3          # +N монстров за каждую волну (4, 7, 10, 13...)
  damage-per-tick: 8        # Прочности блока привата за атаку
  damage-interval-ms: 10000 # Интервал между уроном (мс)
  difficulty-scaling: true
  wave-difficulty-bonus: 0.15
  rewards:
    per-wave-rep: 50
    completion-bonus-rep: 200
    rare-drop-chance: 15
    siege-essences:
      enabled: true
      drop-chance: 8
      types:
        - "IRON_ESSENCE"
        - "GOLD_ESSENCE"
        - "DIAMOND_ESSENCE"

# ==========================================
#  СУПЕР-БОССЫ (BossAbilityRegistry)
# ==========================================
bosses:
  vk-msg-cooldown-ms: 5000
  warlord:
    display-name: "Древний Воевода"
    hp: 500.0
    damage: 15.0
    phase2-threshold: 0.5
    phase2-effects:
      - "SPEED:1:12000"
      - "INCREASE_DAMAGE:0:12000"
    phase2-message: "§c[Древний Воевода] МОЯ КРОВЬ КИПИТ! ПОЗНАЙТЕ ИСТИННУЮ ЯРОСТЬ КЛИНКА!"
    phase2-sound: "ENTITY_ENDER_DRAGON_GROWL"
    aura-particle: "REDSTONE"
    aura-dust-color: "255,0,0"
    abilities:
      spin_attack:
        message: "§c[Древний Воевода] РАССЕКАЮЩИЙ УДАР КЛИНКА!"
        min-phase: 2
        cooldown-ms: 8000
        range: 6.0
        damage: 8.0
        particle: "SWEEP_ATTACK"
        sound: "ENTITY_PLAYER_ATTACK_SWEEP"
        target-effects:
          - "KNOCKUP:0.5"
  storm:
    display-name: "Повелитель Бури"
    hp: 600.0
    damage: 15.0
    phase2-threshold: 0.5
    phase2-effects: []
    phase2-message: "§b[Повелитель Бури] ГРОЗА ПОГЛОТИТ ВАС! ПРЕКЛОНИТЕ КОЛЕНИ ПЕРЕД СТИХИЕЙ!"
    phase2-sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
    aura-particle: "SOUL_FIRE_FLAME"
    abilities:
      tornado:
        message: "§b[Повелитель Бури] ПОДЧИНИТЕСЬ СИЛЕ УРАГАНА!"
        min-phase: 1
        cooldown-ms: 12000
        range: 10.0
        damage: 5.0
        particle: "CLOUD"
        sound: "ENTITY_ENDER_DRAGON_FLAP"
        target-effects:
          - "SLOW:80:1"
          - "BLINDNESS:60:0"
          - "PULL:0.45"
        special-action: "tornado_variant"
  alchemist:
    display-name: "Проклятый Алхимик"
    hp: 550.0
    damage: 15.0
    phase2-threshold: 0.5
    phase2-effects: []
    phase2-message: "§d[Проклятый Алхимик] ХА-ХА-ХА! МОИ СМЕРТЕЛЬНЫЕ РЕАГЕНТЫ ГОТОВЫ К РАСПЫЛЕНИЮ!"
    phase2-sound: "ENTITY_WITCH_CELEBRATE"
    aura-particle: "SPELL_WITCH"
    abilities:
      poison_flask:
        message: "§d[Проклятый Алхимик] ПОПРОБУЙТЕ МОЙ НОВЫЙ ЯДОВИТЫЙ РЕАГЕНТ!"
        min-phase: 2
        cooldown-ms: 9000
        range: 5.0
        damage: 0
        particle: "SPELL_WITCH"
        sound: "ENTITY_SPLASH_POTION_BREAK"
        target-effects:
          - "POISON:120:1"
          - "WITHER:80:0"
        special-action: "self_heal_5pct"
  void_walker:
    display-name: "Странник Бездны"
    hp: 700.0
    damage: 15.0
    phase2-threshold: 0.4
    phase2-effects:
      - "SPEED:1:12000"
      - "INCREASE_DAMAGE:1:12000"
    phase2-message: "§5[Странник Бездны] БЕЗДНА ОТКРЫВАЕТСЯ! ПРОСТРАНСТВО РАЗРЫВАЕТСЯ!"
    phase2-sound: "ENTITY_ENDER_DRAGON_GROWL"
    aura-particle: "REVERSE_PORTAL"
    aura-dust-color: "80,0,120"
