      - "DIAMOND;3;7"
      - "NETHERITE_INGOT;1;2"
    rare:
      - "ELYTRA;1;1;0.5"       # 0.5% шанс
      - "TOTEM_OF_UNDYING;1;1;2" # 2% шанс
      - "SHULKER_BOX;1;1;3"     # 3% шанс
