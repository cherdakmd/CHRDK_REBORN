    enabled: true
    drop-chance-mini: 15
    drop-chance-raid: 35
    drop-chance-world: 60
    types:
      - "FIRE_ESSENCE"
      - "ICE_ESSENCE"
      - "POISON_ESSENCE"
      - "STORM_ESSENCE"
      - "DARK_ESSENCE"
      - "LIGHT_ESSENCE"
  element-crystal:
    enabled: true
    drop-chance: 5
    upgrade-success-bonus: 10
  archetype-token:
    enabled: true
    drop-chance: 8
    types:
      - "TANK_TOKEN"
      - "ASSASSIN_TOKEN"
      - "ARCHER_TOKEN"
      - "SHAMAN_TOKEN"
      - "NECROMANCER_TOKEN"
      - "HUNTER_TOKEN"
      - "PALADIN_TOKEN"
      - "RANGER_TOKEN"

