    per-rank: 3
    max-chance: 50
  multiply-exp: true
  multiply-items: true
  extra-rewards:
    enabled: true
    min-multiplier: 3.0
    chance: 15
    items:
      - "DIAMOND;1;3"
      - "GOLDEN_APPLE;1;1"
      - "EMERALD;2;5"
      - "NETHERITE_SCRAP;1;1"
      - "HEART_OF_THE_SEA;1;1"
      - "ENCHANTED_GOLDEN_APPLE;1;1"
