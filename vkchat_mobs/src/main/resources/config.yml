# ==========================================
# ШТОРМ МОБОВ — мировое событие
# ==========================================
mob-storm:
  enabled: true
  trigger-chance-percent: 10
  total-mobs: 50
  waves:
    - count: 10
      delay-ticks: 0
    - count: 15
      delay-ticks: 200
    - count: 25
      delay-ticks: 400
  duration-seconds: 30
  mob-rank: 5
  mob-multiplier: 2.0
  broadcast: true

# ==========================================
# Mobs / Events 2.0 — контракты, рейды, мировые угрозы
# ==========================================
events2:
  announcements:
    chat: true
    vk: true
  triggers:
    enabled: true
    mob-kills-for-threat: 240
    threat-chance-percent: 30
  threats:
    phase-seconds: 45
    safe-search-radius: 80
    protected-radius: 48
  raid:
    rewards:
      participant-rep: 120
      top-damage-bonus-rep: 80
      killer-bonus-rep: 60
  anti-farm:
    daily-rare-cap: 5
