      teleport:
        message: "§5[Странник Бездны] ПРОСТРАНСТВО СКЛАДЫВАЕТСЯ ВОКРУГ МЕНЯ!"
        min-phase: 2
        cooldown-ms: 6000
        range: 0
        damage: 0
        particle: "REVERSE_PORTAL"
        sound: "ENTITY_ENDERMAN_TELEPORT"
        target-effects: []
        special-action: "teleport_10_blocks"
      void_explosion:
        message: "§5[Странник Бездны] БЕЗДНА ПОГЛОЩАЕТ ВСЁ!"
        min-phase: 2
        cooldown-ms: 10000
        range: 5.0
        damage: 12.0
        particle: "DRAGON_BREATH"
        sound: "ENTITY_ENDER_DRAGON_GROWL"
        target-effects:
          - "WITHER:100:1"
          - "BLINDNESS:60:0"
      spawn_endermen:
        message: "§5[Странник Бездны] МОИ СЛУГИ ПРИБЫВАЮТ ИЗ БЕЗДНЫ!"
        min-phase: 2
        cooldown-ms: 15000
        range: 0
        damage: 0
        particle: "REVERSE_PORTAL"
        sound: "ENTITY_ENDERMAN_SCREAM"
        target-effects: []
        special-action: "spawn_4_endermen"

