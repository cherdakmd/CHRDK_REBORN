# ==========================================
# ШТОРМ МОБОВ — мировое событие
# ==========================================
mob-storm:
  enabled: true
  trigger-chance-percent: 10
  total-mobs: 50
  mob-types:                  # Типы мобов для шторма
    - "ZOMBIE"
    - "SKELETON"
    - "SPIDER"
    - "CREEPER"
    - "CAVE_SPIDER"
  waves:
    - count: 10
      delay-ticks: 0
    - count: 15
      delay-ticks: 200
    - count: 25
      delay-ticks: 400
  duration-seconds: 30
  mob-rank: 5
  mob-multiplier: 2.0
  broadcast: true

# ==========================================
# Mobs / Events 2.0 — контракты, рейды, мировые угрозы
# ==========================================
events2:
  announcements:
    chat: true
    vk: true
  triggers:
    enabled: true
    mob-kills-for-threat: 240
    threat-chance-percent: 30
  threats:
    phase-seconds: 45
    safe-search-radius: 80
    protected-radius: 48
  raid:
    rewards:
      participant-rep: 120
      top-damage-bonus-rep: 80
      killer-bonus-rep: 60
  anti-farm:
    daily-rare-cap: 5

# ==========================================
# QoL УЛУЧШЕНИЯ (v2.2.0)
# ==========================================
qol:
  mob-health-bar:
    enabled: true
    show-on-hit: true
    duration-ticks: 60
    format: "&c{current}&7/&a{max}"
  boss-timer:
    enabled: true
    show-broadcast: true
    announce-minutes-before: 5
  spawn-notifications:
    enabled: true
    elite-notification: true
    mini-boss-notification: true
    super-boss-notification: true
    vk-announce: true
  contract-progress:
    enabled: true
    show-on-kill: true
    show-milestones: true
    milestone-percent: [25, 50, 75, 100]
  mob-statistics:
    enabled: true
    track-kills: true
    track-deaths: true
    track-drops: true
    show-daily-summary: true

# ==========================================
# ENHANCEMENTS v4.5 (Улучшения мобов)
# ==========================================
enhancements:
  # Enchantment Looting: бонус к луту и репутации
  looting:
    enabled: true
    bonus-per-level: 1
    rep-multiplier-per-level: 0.05
  # Звуки способностей элитных мобов
  ability-sounds: true
  # Анимация смерти элитных мобов (частицы + звуки)
  death-animation: true
  # Kill streak: бонус к репутации за серии убийств
  kill-streak:
    enabled: true
    bonus-per-kill: 0.02
    max-bonus: 0.50
  # Уведомление о спавне элитных мобов
  elite-spawn-notify: true
  elite-notify-radius: 100
  # Полоса здоровья босса
  boss-health-bar: true
  # Объявление волн осады
  siege-wave-announce: true
  # Contract streak: бонус за серию контрактов без пропусков
  contract-streak:
    enabled: true
    bonus-per-streak: 0.05
    max-bonus: 0.50
  # Энциклопедия мобов: отслеживание убитых типов
  encyclopedia:
    enabled: false
  # Индикаторы урона (частицы при большом уроне)
  damage-indicators: false
  # Объявление редких дропов в чат
  rare-drop-announce: true
  # Прогресс контракта в action bar
  contract-progress-bar: true
