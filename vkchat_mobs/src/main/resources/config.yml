  scaling:
    per-nearby-player: 0.20
    per-progress-point: 0.004
    night-cave: 0.25
    max: 5.0
  abilities:
    enabled: true
    cooldown-ms: 8000
    telegraph-ticks: 30
    zone-damage: 5.0
  anti-farm:
    max-elites-per-world: 35
    reward-cooldown-ms: 2500
  rewards:
