# ==========================================
#  ДИНАМИЧЕСКОЕ УСИЛЕНИЕ МОБОВ (VKChat Mobs)
# ==========================================
settings:
  enabled: true
  search-radius: 64.0

# ==========================================
#  ФОРМУЛА СЛОЖНОСТИ
# ==========================================
difficulty:
  rank-divider: 25.0
  max-multiplier: 10.0
  show-health-nameplate: true

# ==========================================
# ⚔ ХАРАКТЕРИСТИКИ УСИЛЕНИЯ
# ==========================================
scaling:
  health: true
  damage: true
  speed: false
  affect-spawners: false

# ==========================================
#  КРОВАВАЯ ЛУНА И МИНИ-БОССЫ
# ==========================================
blood_moon:
  stat-multiplier: 1.5
  glowing: true

mini_bosses:
  spawn-chance: 5
  blood-moon-spawn-chance: 15
  stat-multiplier: 2.0
  guaranteed-loot:
    - "DIAMOND;2;5"
    - "GOLDEN_APPLE;1;2"
    - "EMERALD;3;8"

# ==========================================
#  СПОСОБНОСТИ ЭЛИТНЫХ МОБОВ
# ==========================================
abilities:
  regeneration:
    enabled: true
    min-rank: 3
    heal-amount: 1.5
  fire_strike:
    enabled: true
    min-rank: 4
    chance: 25
    duration-seconds: 4
  web_weaver:
    enabled: true
    min-rank: 5
    chance: 15
    slowness-duration-seconds: 5
  minion_summon:
    enabled: true
    min-rank: 6
    chance: 10
    cooldown-seconds: 15

# ==========================================
#  ЛУТ И НАГРАДЫ
# ==========================================
loot:
  multiply-exp: true
  multiply-items: true
  extra-rewards:
    enabled: true
    min-multiplier: 3.0
    chance: 15
    items:
      - "DIAMOND;1;3"
      - "GOLDEN_APPLE;1;1"
      - "EMERALD;2;5"
      - "NETHERITE_SCRAP;1;1"
      - "HEART_OF_THE_SEA;1;1"
      - "ENCHANTED_GOLDEN_APPLE;1;1"
  boss-drops:
    enabled: true
    guaranteed:
      - "DIAMOND;3;7"
      - "NETHERITE_INGOT;1;2"
    rare:
      - "ELYTRA;1;1;0.5"       # 0.5% шанс
      - "TOTEM_OF_UNDYING;1;1;2" # 2% шанс
      - "SHULKER_BOX;1;1;3"     # 3% шанс
      - "BEACON;1;1;1"          # 1% шанс

# ==========================================
# HARDCORE RPG MOBS
