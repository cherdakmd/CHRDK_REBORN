# ==========================================
#  ДИНАМИЧЕСКОЕ УСИЛЕНИЕ МОБОВ (VKChat Mobs)
# ==========================================
settings:
  enabled: true
  search-radius: 64.0

# ==========================================
#  ФОРМУЛА СЛОЖНОСТИ
# ==========================================
difficulty:
  rank-divider: 25.0
  max-multiplier: 10.0
  show-health-nameplate: true

# ==========================================
# ⚔ ХАРАКТЕРИСТИКИ УСИЛЕНИЯ
# ==========================================
scaling:
  health: true
  damage: true
  speed: false
  affect-spawners: false

# ==========================================
#  СТИХИИ
# ==========================================
elements:
  ice:
    name: "Лёд"
    color: "§b"
    damage-bonus: 0.15
    particle: SNOWFLAKE
  blood:
    name: "Кровь"
    color: "§4"
    damage-bonus: 0.20
    particle: DAMAGE_INDICATOR
  wind:
    name: "Ветер"
    color: "§7"
    damage-bonus: 0.10
    particle: CLOUD
    effects:
      knockback: 1.5
      speed-duration-ticks: 60
  earth:
    name: "Земля"
    color: "§6"
    damage-bonus: 0.12
    particle: BLOCK_DUST
    effects:
      slowness-duration-ticks: 80
      resistance-duration-ticks: 100
  crystal:
    name: "Кристалл"
    color: "§d"
    damage-bonus: 0.18
    particle: END_ROD
    effects:
      reflect-chance: 20
      reflect-percent: 30

# ==========================================
#  АРХЕТИПЫ
# ==========================================
archetypes:
  paladin:
    name: "Паладин"
    description: "Святой воин, карающий нежить"
    bonus-health: 20
    bonus-damage: 5
    ability: "holy_smite"
  ranger:
    name: "Следопыт"
    description: "Мастер дальнего боя и выживания"
    bonus-health: 10
    bonus-damage: 8
    ability: "precision_shot"
  alchemist:
    name: "Алхимик"
    description: "Мастер зелий и ядов"
    bonus-health: 15
    bonus-damage: 3
    ability: "potion_throw"
    effects:
      poison-duration-ticks: 100
      weakness-duration-ticks: 80
  summoner:
    name: "Призыватель"
    description: "Призывает союзников на поле боя"
    bonus-health: 25
    bonus-damage: 0
    ability: "summon_minions"
    effects:
      summon-count: 3
      summon-type: "ZOMBIE"
  guardian:
    name: "Страж"
    description: "Защищает ближайших мобов"
    bonus-health: 40
    bonus-damage: -3
    ability: "protect_allies"
    effects:
      protection-radius: 8
      damage-reduction-percent: 25

# ==========================================
#  ОСАДА (SIEGE)
# ==========================================
siege:
  enabled: true
  wave-interval-seconds: 300
  max-waves: 5
  difficulty-scaling: true
  wave-difficulty-bonus: 0.15
  rewards:
    per-wave-rep: 50
    completion-bonus-rep: 200
    rare-drop-chance: 15
    siege-essences:
      enabled: true
      drop-chance: 8
      types:
        - "IRON_ESSENCE"
        - "GOLD_ESSENCE"
        - "DIAMOND_ESSENCE"

# ==========================================
#  КРОВАВАЯ ЛУНА И МИНИ-БОССЫ
# ==========================================
blood_moon:
  stat-multiplier: 1.5
  glowing: true

mini_bosses:
  spawn-chance: 5
  blood-moon-spawn-chance: 15
  stat-multiplier: 2.0
  guaranteed-loot:
    - "DIAMOND;2;5"
    - "GOLDEN_APPLE;1;2"
    - "EMERALD;3;8"

# ==========================================
#  СПОСОБНОСТИ ЭЛИТНЫХ МОБОВ
# ==========================================
abilities:
  regeneration:
    enabled: true
    min-rank: 3
    heal-amount: 1.5
  fire_strike:
    enabled: true
    min-rank: 4
    chance: 25
    duration-seconds: 4
  web_weaver:
    enabled: true
    min-rank: 5
    chance: 15
    slowness-duration-seconds: 5
  minion_summon:
    enabled: true
    min-rank: 6
    chance: 10
    cooldown-seconds: 15
  earthquake:
    enabled: true
    min-rank: 7
    chance: 12
    damage: 6.0
    radius: 5
    stun-duration-ticks: 40
  tornado:
    enabled: true
    min-rank: 8
    chance: 10
    pull-radius: 8
    pull-strength: 1.2
    damage: 4.0
  poison_cloud:
    enabled: true
    min-rank: 5
    chance: 18
    radius: 4
    duration-ticks: 100
    damage-per-tick: 1.0
  fire_nova:
    enabled: true
    min-rank: 9
    chance: 8
    damage: 8.0
    radius: 6
    fire-duration-ticks: 80
  ice_spike:
    enabled: true
    min-rank: 6
    chance: 15
    damage: 5.0
    range: 12
    slowness-duration-ticks: 60

# ==========================================
#  ЛУТ И НАГРАДЫ
# ==========================================
loot:
  multiply-exp: true
  multiply-items: true
  extra-rewards:
    enabled: true
    min-multiplier: 3.0
    chance: 15
    items:
      - "DIAMOND;1;3"
      - "GOLDEN_APPLE;1;1"
      - "EMERALD;2;5"
      - "NETHERITE_SCRAP;1;1"
      - "HEART_OF_THE_SEA;1;1"
      - "ENCHANTED_GOLDEN_APPLE;1;1"
  boss-drops:
    enabled: true
    guaranteed:
      - "DIAMOND;3;7"
      - "NETHERITE_INGOT;1;2"
    rare:
      - "ELYTRA;1;1;0.5"       # 0.5% шанс
      - "TOTEM_OF_UNDYING;1;1;2" # 2% шанс
      - "SHULKER_BOX;1;1;3"     # 3% шанс
      - "BEACON;1;1;1"          # 1% шанс
    void_walker:
      guaranteed:
        - "DIAMOND;5;10"
        - "NETHERITE_INGOT;2;4"
        - "END_CRYSTAL;1;2"
      rare:
        - "ELYTRA;1;1;1"        # 1% шанс
        - "TOTEM_OF_UNDYING;1;1;3" # 3% шанс
        - "SHULKER_BOX;1;1;5"   # 5% шанс
  # Новые типы дропа (v2.2.0)
  boss-essence:
    enabled: true
    drop-chance-mini: 15
    drop-chance-raid: 35
    drop-chance-world: 60
    types:
      - "FIRE_ESSENCE"
      - "ICE_ESSENCE"
      - "POISON_ESSENCE"
      - "STORM_ESSENCE"
      - "DARK_ESSENCE"
      - "LIGHT_ESSENCE"
  element-crystal:
    enabled: true
    drop-chance: 5
    upgrade-success-bonus: 10
  archetype-token:
    enabled: true
    drop-chance: 8
    types:
      - "TANK_TOKEN"
      - "ASSASSIN_TOKEN"
      - "ARCHER_TOKEN"
      - "SHAMAN_TOKEN"
      - "NECROMANCER_TOKEN"
      - "HUNTER_TOKEN"
      - "PALADIN_TOKEN"
      - "RANGER_TOKEN"

# ==========================================
#  КОНТРАКТЫ НА ОХОТУ
# ==========================================
contracts:
  slayer:
    name: "Истребитель"
    description: "Убить 50 мобов любого типа"
    required: 50
    rep-reward: 400
    rune-tokens: 3
    artifact-shards: 2
    unlock-completed: 15
    unlock-hunter-level: 30
  boss_hunter:
    name: "Охотник на Боссов"
    description: "Убить 5 мини-боссов"
    required: 5
    rep-reward: 500
    rune-tokens: 4
    artifact-shards: 3
    unlock-completed: 20
    unlock-hunter-level: 35
    target-type: "mini_boss"
  element_master:
    name: "Мастер Стихий"
    description: "Убить 30 мобов одной стихии"
    required: 30
    rep-reward: 350
    rune-tokens: 2
    artifact-shards: 2
    unlock-completed: 10
    unlock-hunter-level: 20
    target-type: "element"
  archetype_slayer:
    name: "Убийца Архетипов"
    description: "Убить 20 мобов одного архетипа"
    required: 20
    rep-reward: 450
    rune-tokens: 3
    artifact-shards: 2
    unlock-completed: 12
    unlock-hunter-level: 25
    target-type: "archetype"

