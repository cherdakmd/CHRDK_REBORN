# Market 3.0: жёсткая экономика
market2:
  donate:
    sell-multiplier:
      spark: 1.20
      flame: 1.50
      star: 1.80
      legend: 2.50
    buy-multiplier:
      spark: 0.95
      flame: 0.80
      star: 0.60
      legend: 0.40
  trends:
    min-multiplier: 0.50     # -50% в переизбытке (было -25%)
    max-multiplier: 2.00     # +100% в ажиотаже (было +35%)
  limited-rotation:
    enabled: true
    count: 2
  history:
    min-volume-log: 32
  scarcity:
    enabled: true
    price-spike-multiplier: 3.0    # x3 цена при дефиците
    surplus-crash-multiplier: 0.3  # x0.3 цена при избытке
    auto-recovery-rate: 0.02       # 2% восстановление за интервал
