    sell-multiplier:
      spark: 1.20
      flame: 1.40
      star: 1.60
      legend: 2.00
    buy-multiplier:
      spark: 0.95
      flame: 0.90
      star: 0.80
      legend: 0.70
    # Бонусные лимиты на лимитированные предметы
    limited-bonus:
      spark: 1        # +1 к дневному лимиту
      flame: 2
      star: 3
      legend: 5
    # Скорость восстановления цен (больше = быстрее)
    recovery-multiplier:
      spark: 1.2
      flame: 1.5
      star: 2.0
      legend: 3.0
    # Максимум токенов в день
    daily-token-limit:
      spark: 50
      flame: 100
      star: 200
      legend: 999
  trends:
    min-multiplier: 0.50     # -50% в кризисе
    max-multiplier: 2.00     # +100% в ажиотаже
  events:
    chance: 0.15             # 15% шанс на событие каждые 30 мин
    duration-ms: 600000      # 10 минут
    max-concurrent: 3        # Максимум одновременных событий
  cycle:
    chance: 0.05             # 5% шанс на смену цикла
    duration-ms: 1800000     # 30 минут
  trade-impact: 0.05        # Каждый предмет двигает цену на 5%. 1 покупка = +5% к цене
  limited-rotation:
    enabled: true
    count: 2
  recovery-multiplier: 1.0  # Множитель скорости восстановления
  history:
    min-volume-log: 16
    max-entries: 100
  flash-sale:
    chance: 0.10             # 10% шанс каждые 10 минут
    duration-ms: 300000      # 5 минут
  quest:
    reward: 1000             # Награда за квест
