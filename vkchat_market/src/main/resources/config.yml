# Market 2.0: дневные тренды, ротация редкостей и история экономики.
market2:
  donate:
    sell-multiplier:
      spark: 1.30
      flame: 1.70
      star: 2.20
      legend: 3.00
    buy-multiplier:
      spark: 0.90
      flame: 0.70
      star: 0.40
      legend: 0.00
  trends:
    min-multiplier: 0.75
    max-multiplier: 1.35
  limited-rotation:
    enabled: true
    count: 2
  history:
    min-volume-log: 64
