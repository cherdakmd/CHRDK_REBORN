# ==========================================
# ГЛОБАЛЬНЫЕ НАЦИИ (VKChat Nations)
# ==========================================
config-version: 1
enabled: true
tax-per-chunk: 50 # Налог репутации в день за каждый заприваченный чанк
citizen-daily-tax: 10 # Ежедневный авто-налог с каждого гражданина в Банк нации

# ==========================================
# СИСТЕМА ПРОКАЧКИ ПРИВАТОВ (5 уровней)
# ==========================================
# Пороговые уровни, на которых включаются виды защиты.
# Прокачка осуществляется за репутацию ВК (в меню привата).
# Стоимость уровней: 1->2: 300, 2->3: 600, 3->4: 1000, 4->5: 1500 реп. ВК.
claim:
  max-level: 5
  # Лимит приватов по донат-статусу
  max-claims:
    default: 5
    spark: 10
    flame: 15
    star: 25
    legend: 40
    overlord: 60
    teleport-cost: 20     # Стоимость телепорта /claim home (реп. ВК)
  # Прогрессивная цена приватов: цена = base-cost + (кол-во_приватов * cost-increment)
  base-cost: 100            # цена первого привата
  cost-increment: 50        # наценка за каждый следующий
  # Ур.2: защита блоков/сущностей/рамок от всех взрывов (TNT, криперы, эндер-кристаллы и т.д.)
  explosion-protect-level: 2
  # Ур.3: запрет естественного спавна враждебных монстров (спавнеры работают)
  no-spawn-level: 3
  # Ур.4: защита от поджога, растекания огня и лавы
  fire-protect-level: 4
  # Ур.5: запрет PvP на территории + мгновенный рост ферм
  pvp-protect-level: 5
  farming-level: 5
  # Запас прочности по уровням = base + (level-1)*step  (Ур.1=1000 ... Ур.5=3000)
  durability-base: 1000
  durability-step: 500
  # Ежедневный износ прочности (зависит от размера)
  durability-decay:
    base: 2                # базовый износ
    per-expansion: 1       # доп. износ за каждые 3 блока расширения радиуса

# ==========================================
# КАСТОМНЫЕ СООБЩЕНИЯ ПРИ ВХОДЕ/ВЫХОДЕ ИЗ ПРИВАТОВ
# ==========================================
messages:
  # При входе в чужой приват (в дикие земли)
  enter_nation:
    enabled: true
    # Поддерживает переменные: {player}, {nation}, {owner}
    format: "&8[&c!&8] &f{player} &7вошёл на территорию нации [&c{nation}&7]"

  # При выходе из привата в дикие земли
  exit_nation:
    enabled: true
    # Поддерживает переменные: {player}, {nation}
    format: "&8[&a-&8] &f{player} &7вышел с территории нации [&c{nation}&7]"

  # При входе в свой приват (с диких земель)
  enter_your_chunk:
    enabled: true
    # Поддерживает переменные: {player}, {nation}, {chunk}
    format: "&8[&a+&8] &f{player} &7вернулся на свою территорию [&a{nation}&7]"

  # При выходе из привата (на дикие земли)
  exit_your_chunk:
    enabled: true
    # Поддерживает переменные: {player}, {nation}
    format: "&8[&c-&8] &f{player} &7покинул территорию [&c{nation}&7]"

  # Если приват разрушен (энергия 0)
  chunk_destroyed:
    enabled: true
    # Поддерживает переменные: {player}, {nation}
    format: "&c&l⚠️ {player} &fприват разрушен из-за нехватки энергии!"

# ==========================================
