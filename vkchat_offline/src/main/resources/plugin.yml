name: VKChatOffline
version: 3.2.0
main: ru.example.vkchatoffline.VKChatOfflinePlugin
api-version: "1.16"
depend: [VKChat]
commands:
  stash:
    description: Забрать награды из шахты
    aliases: [тайник, склад, сейф]
    permission: vkchat.offline.player
  shift:
    description: Проверить статус шахтёрской смены
    aliases: [шахта, смена]
    permission: vkchat.offline.player
permissions:
  vkchat.offline.player:
    description: Доступ к сменам и /stash
    default: true
