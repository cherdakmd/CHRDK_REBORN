config-version: 1

# Шахтёрские смены — конфигурация
settings:
  cooldown-minutes: 0  # Кулдаун между сменами (0 = без кулдауна)
  consec-bonus-3: 75   # Бонус в % за 3+ смен подряд
  consec-bonus-5: 150  # Бонус в % за 5+ смен подряд

# Запуск смен из игры (/shift start)
shift:
  rep-cost: 100          # Стоимость запуска смены в репутации
  cooldown-minutes: 5    # Минимальный перерыв между ин-гейм сменами

shifts:
  1h:
    name: "Короткая смена"
    icon: "⛏"
    duration-minutes: 60
    rare-chance: 8           # Шанс редкого лута, %
    rep-min: 800
    rep-max: 1500
    resources:
      - "STONE:64:128"
      - "COAL:32:64"
      - "IRON_INGOT:8:24"
      - "COPPER_INGOT:8:20"
      - "RAW_IRON:4:10"
  3h:
    name: "Стандартная смена"
    icon: "⛏⛏"
    duration-minutes: 180
    rare-chance: 15
    rep-min: 4000
    rep-max: 8000
    resources:
      - "IRON_INGOT:32:80"
      - "GOLD_INGOT:8:32"
      - "REDSTONE:24:64"
      - "COAL:64:128"
      - "COPPER_INGOT:16:48"
      - "RAW_IRON:8:24"
      - "LAPIS_LAZULI:8:20"
      - "AMETHYST_SHARD:4:12"
  8h:
    name: "Ночная смена"
    icon: "⛏⛏⛏"
    duration-minutes: 480
    rare-chance: 22
    rep-min: 12000
    rep-max: 25000
    resources:
      - "GOLD_INGOT:24:64"
      - "DIAMOND:8:24"
      - "LAPIS_LAZULI:32:80"
      - "IRON_INGOT:48:128"
      - "EMERALD:8:16"
      - "AMETHYST_SHARD:16:40"
      - "NETHERITE_SCRAP:2:6"
      - "ANCIENT_DEBRIS:2:5"
  12h:
    name: "Полный рабочий день"
    icon: "⛏⛏⛏⛏"
    duration-minutes: 720
    rare-chance: 30
    rep-min: 25000
    rep-max: 50000
    resources:
      - "DIAMOND:16:40"
      - "EMERALD:8:24"
      - "NETHERITE_SCRAP:4:12"
      - "GOLD_INGOT:40:96"
      - "IRON_INGOT:64:160"
      - "ANCIENT_DEBRIS:4:12"
