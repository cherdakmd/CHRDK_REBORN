    cleric: "Жрец: стабильный класс с меньшим общим уроном"
    rogue: "Разбойник: криты x2, обход ловушек, двойной лут из тайников"
    paladin: "Паладин: +30% HP, лечение себя, сопротивление проклятиям"
    ranger: "Рейнджер: +20% урона на расстоянии, отслеживание, выносливость"
