# ==========================================
# VKChatOffline — хардкорные интерактивные походы в ЛС ВК
# ==========================================
# Общая беседа: только короткая подсказка. Все походы, кнопки и результаты — в ЛС бота.

enabled: true
check-interval-seconds: 10
first-event-delay-seconds: 20
stage-delay-seconds: 60
choice-timeout-seconds: 300
key-drop-chance: 18

death-cooldown-hours: 4
injury-hours: 12
death-rep-loss-percent: 10

# VK ID администраторов оффлайн-модуля.
# Команда: !офадмин list | cancel <vk> | finish <vk> | event <vk> | key <vk> <route> | stash <vk>
vk-admins: []

# Кнопочные команды в ЛС:
# !поход / !офлайн       — контекстное меню
# !пойти <id>            — старт маршрута
# !выбор 1..4            — ответ на интерактивное событие
# !тайник <страница>     — просмотр stash в ВК страницами
# !открыть <id>          — открыть маршрут физическим ключом из stash
# !вопрос 1..6           — справка

adventures:
  forest:
    name: "🌲 Ближний Лес"
    default-unlocked: true
    difficulty: 1
    stages: 3
    max-duration-minutes: 45
    cost: 50
    death-chance: 2
    reward:
      rep-min: 80
      rep-max: 160
      keys: [mine]
      items:
        - "OAK_LOG;16;32;100"
        - "APPLE;2;6;70"
        - "EMERALD;1;2;25"

  mine:
    name: "⛏ Заброшенные Шахты"
    default-unlocked: false
    difficulty: 2
    stages: 4
    max-duration-minutes: 70
    cost: 150
    death-chance: 5
    reward:
      rep-min: 180
      rep-max: 380
      keys: [ruins]
      items:
        - "COAL;16;40;100"
        - "IRON_INGOT;8;20;90"
        - "GOLD_INGOT;3;10;55"
        - "DIAMOND;1;3;22"

  ruins:
    name: "🏛 Древние Руины"
    default-unlocked: false
    difficulty: 3
    stages: 5
    max-duration-minutes: 90
    cost: 250
    death-chance: 7
    reward:
      rep-min: 300
      rep-max: 650
      keys: [swamp]
      items:
        - "EXPERIENCE_BOTTLE;8;24;100"
        - "LAPIS_LAZULI;16;48;70"
        - "BOOK;2;6;45"
        - "ENDER_PEARL;1;4;30"

  swamp:
    name: "☠ Болота Мертвецов"
    default-unlocked: false
    difficulty: 4
    stages: 5
    max-duration-minutes: 100
    cost: 350
    death-chance: 10
    reward:
      rep-min: 450
      rep-max: 900
      keys: [castle]
      items:
        - "SLIME_BALL;8;24;100"
        - "LILY_PAD;4;12;65"
        - "FERMENTED_SPIDER_EYE;2;8;70"
        - "GHAST_TEAR;1;2;18"
        - "TOTEM_OF_UNDYING;1;1;8"

  castle:
    name: "🏰 Проклятый Замок"
    default-unlocked: false
    difficulty: 5
    stages: 6
    max-duration-minutes: 120
    cost: 450
    death-chance: 13
    reward:
      rep-min: 700
      rep-max: 1400
      keys: [nether]
      items:
        - "GOLD_BLOCK;1;3;75"
        - "DIAMOND;2;6;60"
        - "TOTEM_OF_UNDYING;1;1;15"
        - "NETHERITE_SCRAP;1;2;20"

  nether:
    name: "🌋 Адские Врата"
    default-unlocked: false
    difficulty: 6
    stages: 7
    max-duration-minutes: 150
    cost: 800
    death-chance: 18
    reward:
      rep-min: 1100
      rep-max: 2300
      keys: []
      items:
        - "BLAZE_ROD;8;20;100"
        - "QUARTZ;32;64;90"
        - "NETHERITE_SCRAP;2;5;45"
        - "ANCIENT_DEBRIS;1;2;18"
        - "ENCHANTED_GOLDEN_APPLE;1;1;8"
  mountain:
    name: "⛰ Горные Вершины"
    default-unlocked: false
    difficulty: 5
    stages: 6
    max-duration-minutes: 120
    cost: 600
    death-chance: 14
    reward:
      rep-min: 800
      rep-max: 1800
      keys: []
      items:
        - "IRON_INGOT;16;32;80"
        - "GOLD_INGOT;8;16;70"
        - "DIAMOND;1;3;25"
        - "EMERALD;2;6;40"
        - "POINTED_DRIPSTONE;4;8;55"

# Достижения за маршруты
achievements:
  enabled: true
  rewards:
    forest_complete: 50
    mine_complete: 75
    ruins_complete: 100
    swamp_complete: 125
    castle_complete: 150
    nether_complete: 200
    mountain_complete: 175
    all_routes_complete: 500

# Дополнительные механики событий похода
mechanics:
  traps:
    lethal-chance: 6       # базовый шанс мгновенной смерти от ловушки при провале

event-loot:
  treasure:
    items:
      - "EMERALD;1;4;70"
      - "GOLD_INGOT;2;8;65"
      - "EXPERIENCE_BOTTLE;4;12;50"
      - "DIAMOND;1;2;18"

# MMORPG-прогрессия оффлайн-походов
mmorpg:
  base-supplies: 3
  classes:
    warrior: "Воин: меньше риск и урон в боях/против боссов"
    scout: "Следопыт: лучше против ловушек, выживания и сбора ресурсов"
    mage: "Маг: лучше против проклятий, загадок и святилищ"
    cleric: "Жрец: стабильный класс с меньшим общим уроном"
    rogue: "Разбойник: криты x2,ypass ловушки, двойной лут из тайников"
  inspiration:
    auto-reroll: true
  death-saves:
    max: 1
    dc: 12
  companions:
    wolf: "Волк: помогает в боях, засадах и против боссов"
    raven: "Ворон: замечает ловушки, тайники и подсказки"
    alchemist: "Алхимик: лечит, помогает против проклятий и ядов"
    mule: "Мул: даёт больше припасов и спасает от голода"
    dragon_whelp: "Детёныш Дракона: AoE урон огнём, страх перед врагами, +50% к наградам"

