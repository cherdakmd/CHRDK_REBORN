    lucky: "Удача: +10% к шансу редкого лута"
    trader: "Торговец: -20% цены в магазине"
    occult: "Оккультизм: +20% к сопротивлению проклятиям"
    herbalist: "Травник: +30% к эффективности лечения"
    packer: "Носильщик: +2 слота в сумке"
    survivalist: "Выживальщик: +20% к регенерации HP между этапами"
    treasure_hunter: "Охотник за сокровищами: +30% к шансу лута из тайников"
    night_owl: "Сова: +15% ко всем проверкам в тёмных локациях"
    swift_foot: "Быстрая нога: -20% к времени между этапами"
    iron_will: "Железная воля: +30% к сопротивлению страху и потере рассудка"

  # === НОВЫЕ ПРЕДМЕТЫ (v2.1.0) ===
  shop-items:
    grappling_hook:
      name: "🪝 Крюк-кошка"
      description: "Пропускает одну ловушку или опасный этап"
