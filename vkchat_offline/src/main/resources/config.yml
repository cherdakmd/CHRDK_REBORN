    alchemist: "Алхимик: лечит, помогает против проклятий и ядов"
    mule: "Мул: даёт больше припасов и спасает от голода"
    dragon_whelp: "Детёныш Дракона: AoE урон огнём, страх перед врагами"
    bear: "Медведь: танк-компаньон, сильная защита, урон по боссам"
    owl: "Сова: разведка, обнаружение ловушек"
    snake: "Змея: яд на врагов"

  # === НОВЫЕ НАВЫКИ (v2.1.0) ===
