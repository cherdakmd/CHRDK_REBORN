# ════════════════════════════════
# VKChatStreams — Twitch анонсер
# ════════════════════════════════

config-version: 3

# Как часто проверять стримы (в минутах)
check-interval-minutes: 5

twitch:
  enabled: true
  client-id: "YOUR_TWITCH_CLIENT_ID"
  client-secret: "YOUR_TWITCH_CLIENT_SECRET"
  # oauth-token — ручной токен (приоритет над авто)
  oauth-token: ""
  channels:
    - "example_channel"

announcement:
  # Задержка между повторными анонсами одного канала (секунды)
  cooldown-seconds: 300

  # Анонс в беседу ВК
  chat:
    - "🔴⚡ НАЧАЛСЯ СТРИМ ⚡🔴"
    - "🎮 {channel} — {game}"
    - "📺 {title}"
    - "👁 {viewers} зрителей"
    - "🔗 {url}"
    - "💎 /stream reward — награда за просмотр!"

  # Анонс в ЛС игрокам через ВК бота
  player-dm: "🎮 {channel} запустил стрим! 📺 {title} 👁 {viewers} зрителей 🔗 {url} 💎 /stream reward"

# ═══ НАГРАДЫ ═══
rewards:
  reputation: 150
  commands:
    - "give {player} diamond 3"
    - "eco give {player} 500"
    - "xp add {player} 30 levels"
