# ═══════════════════════════════════════
# VKChatStreams — анонсер стримов
# ═══════════════════════════════════════

config-version: 2

# Как часто проверять стримы (в минутах)
check-interval-minutes: 5

streams:
  admin-vk-ids:
    - 123456789

  twitch:
    enabled: true
    client-id: "YOUR_TWITCH_CLIENT_ID"
    oauth-token: "YOUR_TWITCH_OAUTH"
    channels:
      - "example_channel"

  youtube:
    enabled: true
    api-key: "YOUR_YOUTUBE_API_KEY"
    channels:
      - "UC_example_channel_id"

  vk:
    enabled: true
    token: "YOUR_VK_TOKEN"
    group-id: "1"
    groups:
      - "example_group"

    # Пост на стену группы ВК (требуются права wall, photos)
    wall-post:
      enabled: true
      # attachment = photo-OWNERID_PHOTOID (загрузи картинку в альбом группы и скопируй ID)
      photo-attachment: ""

    # Шаблон поста в группу ВК (поддерживает \\n для переноса строк)
    post-template: |
      🔴⚡ НАЧАЛСЯ СТРИМ ⚡🔴\n\n🎮 {channel} запустил трансляцию!\n\n📺 {title}\n\n🔗 Смотреть: {url}\n\n{links}\n\n💎 Заходи на сервер CHRDK!\n⚡ /stream reward — награда за просмотр!

  vkvideo:
    enabled: true
    token: "YOUR_VK_TOKEN"
    channels:
      - "example_channel"

  # Ручное добавление стримеров (ссылки на все платформы)
  manual:
    example:
      vk: "https://vk.com/example"
      youtube: "https://youtube.com/@example"
      twitch: "https://twitch.tv/example"

announcement:
  vk-enabled: true

  # Анонс в игре (цветовые коды &)
  game:
    - "&4&l⚡ &c&lСТРИМ &4&l⚡"
    - "&7Платформа: &f{platform}"
    - "&7Стример: &f{channel}"
    - "&7Название: &f{title}"
    - "&7Ссылка: &b&n{url}"
    - "{links_game}"
    - "&6&l🎯 &e/stream reward &6&l— награда за подписку на канал!"
    - ""

  # Анонс в беседу ВК
  vk:
    - "🔴⚡ НАЧАЛСЯ СТРИМ ⚡🔴"
    - ""
    - "🎮 {channel} запустил стрим!"
    - "📺 {title}"
    - ""
    - "🔗 Смотреть: {url}"
    - "{links_vk}"
    - ""
    - "💎 Заходи на сервер! /stream reward"

# ═══ НАГРАДЫ ЗА ПРОСМОТР ═══
rewards:
  reputation: 150
  commands:
    - "give {player} diamond 3"
    - "eco give {player} 500"
    - "xp add {player} 30 levels"
