# ════════════════════════════════
# VKChatStreams — Twitch анонсер
# ════════════════════════════════

config-version: 4

# Как часто проверять стримы (в минутах)
check-interval-minutes: 5

twitch:
  enabled: true
  client-id: "YOUR_TWITCH_CLIENT_ID"
  client-secret: "YOUR_TWITCH_CLIENT_SECRET"
  oauth-token: ""
  channels:
    - "example_channel"

streamers:
  example_channel:
    youtube: "https://youtube.com/@example"
    vk: "https://vk.com/example"

announcement:
  cooldown-seconds: 300
  keyboard: true

  # Анонс в игре (цветовые коды &)
  game-enabled: true
  game:
    - "&4&l⚡ &c&lСТРИМ &4&l⚡"
    - "&7Стример: &f{channel}"
    - "&7Игра: &f{game}"
    - "&7Название: &f{title}"
    - "&7Зрителей: &f{viewers}"
    - "&7Идёт: &f{uptime}"
    - "&b&n{url}"
    - "&6/stream reward &e— награда за просмотр!"

  # Анонс в беседу ВК
  chat:
    - "🔴⚡ НАЧАЛСЯ СТРИМ ⚡🔴"
    - "🎮 {channel} — {game}"
    - "📺 {title}"
    - "👁 {viewers} зрителей"
    - "🔗 {links}"
    - "💎 /stream reward — награда за просмотр!"

  # Завершение стрима (в беседу ВК)
  offline: "⭕ {channel} завершил стрим. Итог: {claimed} наград выдано, шёл {uptime}."

  # Анонс в ЛС игрокам
  player-dm: "🎮 {channel} запустил стрим! 📺 {title} 👁 {viewers} зрителей 🔗 {url}"

rewards:
  reputation: 150
  commands:
    - "give {player} diamond 3"
    - "eco give {player} 500"
    - "xp add {player} 30 levels"
