# ==========================================
# Модуль Автосообщений (VKChatAnnouncer)
# Актуализировано под текущую версию VKChat_Ultimate
# ==========================================

settings:
  interval: 300              # Интервал между сообщениями, секунды
  random-order: true
  prefix: "&6[CHRDK] &8» &f"
  quiz-chance: 20            # Шанс вместо сообщения запустить викторину, %

messages:
  # Базовая навигация
  - "&fОткрой главное меню сервера командой &e/menu&f: нации, кузня, руны, артефакты, события, охота, рынок."
  - "&fПривяжи ВК через &e/vklink&f: репутация ВК нужна для ковки, телепортов, рун и приватов."
  - "&fРепутация ВК — главная валюта сервера. Баланс в игре: &e/rep&f, переводы: &e/pay <ник> <сумма>&f."
  - "&fКлейми репутацию в монеты: &e/claim&f или команда боту &e!клейм <сумма>&f. Курс в конфиге сервера."

  # Шахтёрские смены
  - "&fШахтёрские смены через ВК: напиши боту &e!шахта&f и выбери длительность. Ресурсы в &e/stash&f."
  - "&fСмены: &e1ч&f / &e3ч&f / &e8ч&f / &e12ч&f. Чем дольше смена — тем ценнее награда!"
  - "&fНе забывай проверять &e/stash&f — все награды со смен приходят туда!"

  # Донат
  - "&fПоддержи сервер: &e/donate info&f. 5 статусов от &b250₽&f до &d5000₽&f со скидками и бонусами на 30 дней."
  - "&fДонат-статусы дают бонусы к репутации, опыту и дропу! Подробнее: &e!донат&f в ЛС бота ВК."

  # Gear / кузня
  - "&fКузня теперь с GUI: &e/forge&f или &e/кузня&f. Положи предмет в центральный слот и выбери перековку или очистку дефектов."
  - "&fОбычный крафт снаряжения создаёт MMO Gear за репутацию ВК. Чем выше &eblacksmith&f в &e/jobs&f, тем лучше шансы и скидки."
  - "&fЭволюция предметов удалена: прокачка идёт через кристаллы заточки в &e/runes&f. Максимум заточки сейчас &e+20&f."
  - "&fСетовая броня больше не роллится случайно. Нужен &eфрагмент сета&f — его можно получить с элитных мобов, боссов и в наградах охоты."
  - "&fПредмет получил дефект? Открой &e/forge&f и нажми очистку дефектов. Дефекты влияют на бой и скорость."
  - "&fРуны ограничены слотами по редкости. Легендарки вмещают больше рун, но получить их намного сложнее."
  - "&fРазбирай ненужное MMO-снаряжение через &e/salvage&f — можно вернуть часть ценности и получить награды."

  # Мобы / охота
  - "&fМобы стали хардкорнее: элитки имеют архетипы, стихии, телеграф атак и ценный лут. Команда: &e/mobs&f."
  - "&fОхота в ВК: напиши &e!охота&f или &e!мобы&f, чтобы узнать про элиток, боссов и награды."
  - "&fСпавнер-мобы не дают редкий лут и репутацию — антифарм защищает экономику сервера."

  # События
  - "&fИвенты больше не должны ломать приваты: аирдропы, метеоры, вторжения и боссы ищут дикую зону."
  - "&fСледи за &e/events&f: аирдропы, метеориты, разломы, боссы, Кровавая Луна, Комета Сокровищ и катаклизмы."
  - "&fВо время мировых событий награды увеличиваются, но и опасность растёт."

  # Артефакты / рынок / профессии
  - "&fАртефакты и эликсиры доступны через &e/artifacts&f или главное меню &e/menu&f."
  - "&fПрофессии в &e/jobs&f влияют на серверные системы: кузнец помогает ковке, а уровни профессий усиливают прогресс."
  - "&fРынок &e/market&f позволяет покупать и продавать ресурсы за репутацию ВК. Следи за ценами."
  - "&fТорговля на рынке — выгодный способ обмена ресурсами. Купи дёшево, продай дорого!"

  # Нации / приваты / телепорты
  - "&fПриваты теперь блочные. Купи блок привата через &e/nation buyclaim&f и прокачивай защиту через меню нации."
  - "&fНации, мутации и приваты открываются через &e/nation&f. Смена нации сбрасывает старые земли и мутации."
  - "&fТелепорты за репутацию: &e/rtp&f, &e/home&f, &e/tpa <ник>&f. Движение во время подготовки отменяет телепорт."
  - "&fСтоимость телепорта зависит от расстояния: чем дальше — тем больше репутации спишется!"
  - "&fБонус нации: члены одной фракции получают скидки на приваты и телепорты. Объединяйся!"

  # Соцсети и статистика
  - "&fВ группе ВК публикуются новости и промокоды: &bhttps://vk.com/chrdk_reborn"
  - "&fTelegram разработчика и новости проекта: &bhttps://t.me/cherdakmd"
  - "&f%stats%"

formats:
  stats:
    - "&eСтатистика сервера CHRDK REBORN:"
    - "&fИгроков онлайн: &b%online%"
    - "&fЗаходов за сегодня: &b%today_joins%"
    - "&fТоп 1 по репутации: &a%top_rep%"
    - "&fТоп 2-3 доступны через &e!топреп&f в ВК"
