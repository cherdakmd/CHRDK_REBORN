# =========================================================================
# VKChatTeleport — телепортация за репутацию ВК
# =========================================================================
config-version: 1

teleportation:
  rtp:
    cost: 150
    cooldown: 60
    min-x: -5000
    max-x: 5000
    min-z: -5000
    max-z: 5000

  home:
    cost: 100
    cooldown: 30
    max-homes: 3

  tpa:
    cost: 100
    cooldown: 30

  tpahere:
    cost: 100
    cooldown: 30

  back:
    cost: 50
    cooldown: 120

  warmup:
    delay: 3
    cancel-on-move: true
    cancel-on-damage: true

# Anti-abuse protection for TPA system
tpa:
  cooldown-seconds: 30
  request-expiry-seconds: 60
  spam-threshold: 3
  spam-window-minutes: 5
  shield-duration-minutes: 10
  combat-cooldown-seconds: 10

  donate-tiers:
    spark:
      cost-multiplier: 0.90
      cooldown-multiplier: 0.80
      max-homes: 5
      discount-percent: 0.10
    flame:
      cost-multiplier: 0.80
      cooldown-multiplier: 0.65
      max-homes: 8
      discount-percent: 0.20
    star:
      cost-multiplier: 0.65
      cooldown-multiplier: 0.50
      max-homes: 12
      discount-percent: 0.35
    legend:
      cost-multiplier: 0.50
      cooldown-multiplier: 0.30
      max-homes: 16
      discount-percent: 0.50
    overlord:
      cost-multiplier: 0.35
      cooldown-multiplier: 0.15
      max-homes: 20
      discount-percent: 0.65
