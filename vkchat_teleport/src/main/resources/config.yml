# =========================================================================
# VKChatTeleport — телепортация за репутацию ВК
# =========================================================================

teleportation:
  rtp:
    cost: 10
    cooldown: 3600
    min-x: -5000
    max-x: 5000
    min-z: -5000
    max-z: 5000

  home:
    cost: 5
    cooldown: 1800
    max-homes: 3

  tpa:
    cost: 20
    cooldown: 1200

  warmup:
    delay: 3
    cancel-on-move: true
    cancel-on-damage: true

  # DonatePay-бонусы нашего комплекса: скидка на телепорты.
  donate-discount:
    spark: 0.30
    flame: 0.80
    star: 1.50
    legend: 2.50
