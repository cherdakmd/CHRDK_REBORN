# =========================================================================
# VKChatTeleport — телепортация за репутацию ВК
# =========================================================================

teleportation:
  rtp:
    cost: 50
    cooldown: 60
    min-x: -5000
    max-x: 5000
    min-z: -5000
    max-z: 5000

  home:
    cost: 25
    cooldown: 60
    max-homes: 3

  tpa:
    cost: 75
    cooldown: 60

  warmup:
    delay: 3
    cancel-on-move: true
    cancel-on-damage: true

  # DonatePay-бонусы: скидка на телепорты
  donate-discount:
    spark: 0.10
    flame: 0.25
    star: 0.40
    legend: 0.60

  # Кулдаун для донатеров (секунды, меньше = быстрее)
  donate-cooldown:
    rtp:
      spark: 45        # 45 сек (было 60)
      flame: 30        # 30 сек
      star: 15         # 15 сек
      legend: 0        # без кд
    home:
      spark: 45
      flame: 30
      star: 15
      legend: 0
    tpa:
      spark: 45
      flame: 30
      star: 15
      legend: 0

  # Время каста для донатеров (секунды)
  donate-warmup:
    spark: 2
    flame: 1
    star: 0            # мгновенно
    legend: 0          # мгновенно

  # Максимум домов для донатеров
  donate-max-homes:
    spark: 5
    flame: 8
    star: 12
    legend: 20
