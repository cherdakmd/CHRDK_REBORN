# =========================================================================
# VKChatTeleport — телепортация за репутацию ВК
# =========================================================================

teleportation:
  rtp:
    cost: 50
    cooldown: 3600
    min-x: -5000
    max-x: 5000
    min-z: -5000
    max-z: 5000

  home:
    cost: 25
    cooldown: 1800
    max-homes: 3

  tpa:
    cost: 75
    cooldown: 1200

  warmup:
    delay: 3
    cancel-on-move: true
    cancel-on-damage: true

  # DonatePay-бонусы: скидка на телепорты
  donate-discount:
    spark: 0.10
    flame: 0.25
    star: 0.40
    legend: 0.60
