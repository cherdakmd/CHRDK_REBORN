# Настройки Синтеза (Скрещивание предметов)
synthesis:
  scroll_name: "&d&l Свиток Синтеза"
  scroll_lore:
    - "&7Древний магический пергамент."
    - "&7Позволяет объединить чары двух Легендарных"
    - "&7или Эпических предметов одного типа."
    - ""
    - "&e▶ Положите предмет-основу в левую руку"
    - "&e▶ Положите предмет-жертву в инвентарь (первый слот)"
    - "&e▶ Возьмите свиток в правую руку и нажмите ПКМ"
