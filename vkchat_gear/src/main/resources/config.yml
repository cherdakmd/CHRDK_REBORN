# Подробные конфигурации вынесены в отдельные файлы:
#   enchants.yml        — кастомные чары (custom_enchants)
#   sets.yml            — сеты и бонусы (sets)
#   rune_market.yml     — очистка рун и UX-улучшения (rune-cleansing, enhancements)
#   forge_advanced.yml  — кузня 2.0 (forge2: свитки, ресурсы, артефакты)
# ==========================================

# Настройки Синтеза (Скрещивание предметов)
