# ==========================================
# ХАРДКОРНАЯ RPG-КОВКА И НЕРФ СНАРЯЖЕНИЯ
# ==========================================
hardcore-forging:
  enabled: true
  craft-cost: 120              # Базовая цена в репутации ВК за превращение скрафченного предмета в MMO Gear
  reforge-cost: 650            # Полная перековка предмета через /forge
  rarity-upgrade-cost: 500     # Попытка повысить редкость: 3 предмета одной редкости, боковые сгорают
  rarity-upgrade-chance:
    uncommon: 85
    rare: 65
    epic: 40
    legendary: 20
    ancient: 8
  rarity-fusion-scroll:
    price: 10000
  cleanse-cost: 350            # Очистка дефекта через /forge cleanse
  rune-apply-cost: 75          # Доп. цена за нанесение руны, помимо покупки руны
  crystal-apply-cost: 50       # Доп. цена за попытку заточки, помимо покупки кристалла
  crystals:
    tiers:
      common:
        from: 0
        to: 10
        success: 90
        downgrade-chance: 25
      rare:
        from: 10
        to: 15
        success: 60
      legendary:
        from: 15
        to: 20
        success: 35
      ancient:
        from: 20
        to: 25
        success: 25
        downgrade-chance: 40
  max-upgrade-level: 25        # Новый баланс заточки: максимум +25
  destroy-chance:
    craft: 2                   # шанс провала ковки при обычном крафте
    reforge: 8                 # шанс уничтожения предмета при /forge
    crystal-rare: 2            # шанс уничтожения при провале редкого кристалла
    crystal-legendary: 6       # шанс уничтожения при провале легендарного кристалла
    crystal-ancient: 10        # шанс уничтожения при провале древнего кристалла
  blacksmith:
    discount-per-level: 0.01   # 1% скидки за уровень, ограничивается max-discount
    max-discount: 0.45
    failure-reduction-per-level: 0.01
    ancient-unlock-level: 35
    legendary-unlock-level: 25
    epic-unlock-level: 15
    rare-unlock-level: 5
  rarity-nerf:
    luck-multiplier-per-point: 0.004
    material-cap:
      WOOD: uncommon
      STONE: rare
      GOLD: rare
      IRON: epic
      DIAMOND: epic
      NETHERITE: ancient
      OTHER: rare
  defects:
    chance-on-craft-fail: 70
    chance-on-reforge-fail: 85
    list:
      fragile: "&cДефект: Хрупкий (-10% защиты, быстрее ломается)"
      heavy: "&8Дефект: Тяжёлый (замедляет владельца)"
      dull: "&7Дефект: Тусклый (-10% урона)"
      cracked: "&4Дефект: Глубокая трещина (дорогая очистка, признак опасной ковки)"
      cursed: "&5Дефект: Метка Чернобога (мистический дефект)"
      unstable: "&6Дефект: Нестабильная сталь (предмет требует очищения)"
  rune-slots:
    common: 0
    uncommon: 1
    rare: 1
    epic: 2
    legendary: 3
    ancient: 4
  set-fragments:
    enabled: true
    consume-on-craft: true
    require-origin: true       # Сетовый бонус работает только у предметов с легальным происхождением
    allow-legacy: false        # Старые сетовые предметы без origin НЕ активируют бонусы
    notify-illegal: true       # Писать игроку и в консоль о подозрительном сетовом предмете
    item-material: PAPER
    display-format: "&6Фрагмент сета: {set}"
    # Если игрок держит в инвентаре фрагмент сета, при ковке брони фрагмент расходуется и предмет становится частью сета.
    # Без фрагмента обычная ковка больше не роллит сетовую часть.

# Защита от незаконных сетовых предметов
# Сетовые бонусы работают только если у предмета есть gear_set_origin.
# Легальные origin: fragment, admin, mob_drop, offline_reward. legacy разрешается отдельно.
hardcore-set-security:
  info: "Настройки перенесены в hardcore-forging.set-fragments ниже. Этот блок информационный."

# Слияние редкости в GUI /forge:
# 3 предмета одной редкости -> шанс повысить центральный предмет. Боковые предметы сгорают.
hardcore-rarity-fusion:
  info: "Цена используется из hardcore-forging.rarity-upgrade-cost"

# Свойства редкости: боевые бонусы и lore-описание
rarity-properties:
  common:
    damage-bonus: 0.0
