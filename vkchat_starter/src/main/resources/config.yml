    enabled: true
    material: "GOLD_BLOCK"
    radius: 8
    name: "&6&lБлок привата"
    lore:
      - "&7Радиус защиты: &e8 блоков"
      - "&7Поставь в мире для защиты территории"
      - "&7Питай приват: &e/n feed"
      - ""
      - "&c⚠ Только для нового игрока!"

  # Стартовое снаряжение
  equipment:
    weapon:
      material: "STONE_SWORD"
      name: "&7[Обычный] &fМеч Скитальца"
      lore:
        - "&7Редкость: &7[Обычный]"
        - "&8Первое оружие для выживания"
      enchants:
        - "DAMAGE_ALL;1"
        - "DURABILITY;3"
    pickaxe:
      material: "WOODEN_PICKAXE"
      name: "&7[Обычный] &fКирка Скитальца"
      lore:
        - "&7Редкость: &7[Обычный]"
      enchants:
        - "DIG_SPEED;1"
        - "DURABILITY;3"
    axe:
      material: "STONE_AXE"
      name: "&7[Обычный] &fТопор Скитальца"
      lore:
        - "&7Редкость: &7[Обычный]"
      enchants:
        - "DIG_SPEED;1"
        - "DURABILITY;3"
    shovel:
      material: "WOODEN_SHOVEL"
      name: "&7[Обычный] &fЛопата Скитальца"
      lore:
        - "&7Редкость: &7[Обычный]"
      enchants:
        - "DIG_SPEED;1"
        - "DURABILITY;3"

  # Стартовые ресурсы
  resources:
    food:
      material: "BREAD"
      amount: 32
    torches:
      material: "TORCH"
      amount: 64
    cobblestone:
      material: "COBBLESTONE"
      amount: 64
    wood:
      material: "OAK_PLANKS"
      amount: 32

  # Стартовый бонус репутации
  starter-reputation: 500

  # Дать ли артефакты
  give-artifacts: true
  artifact-count: 2

