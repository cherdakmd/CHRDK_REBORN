# ==========================================
# VKChat Starter v3.0.0 — Полная переработка
# 35 обновлений для нового игрока
# ==========================================

settings:
  enabled: true
  welcome-message: "&e&l★ CHRDK REBORN ★ &7» &aДобро пожаловать! Ты получил стартовый набор, блок привата и книгу-руководство. Удачной игры!"

  # Защита нового игрока (неуязвимость после входа)
