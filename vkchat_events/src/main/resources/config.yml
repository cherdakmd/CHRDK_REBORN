
# --- АИРДРОПЫ ---
airdrops:
  interval: 3600              # Попытка спавна каждый час
  min-online: 3               # Минимальный онлайн для падения Аирдропа
  capture-time: 30            # Время захвата в секундах
  crater-radius: 3            # Радиус кратера при падении
  protected-radius: 24        # Радиус проверки приватных территорий вокруг точки падения
  prevent-nation-claims: true   # Запретить падение в приватах VKChatNations
  reminder-interval: 300      # Интервал напоминания об активном Аирдропе в секундах (5 минут)
  
  # Интеграция с ВК
  coord-fuzziness: 200        # Радиус размытия координат (Бесплатные координаты: "X: 100-300")
  exact-coords-cost: 50       # Цена репутации ВК за точные координаты (!аирдроп)
  
  tiers:
    medical:
      name: "&c[Медицинский Груз]"
      boss: "WITCH" 
      mobs:
        - "ZOMBIE;3"
      items:
        - "POTION;1;3"
        - "GOLDEN_APPLE;2;5"
        - "GLISTERING_MELON_SLICE;5;10"
    military:
      name: "&8[Оружейный Груз]"
      boss: "PILLAGER" 
      mobs:
        - "VINDICATOR;2"
      items:
        - "DIAMOND;5;10"
        - "IRON_INGOT;16;32"
    legendary:
      name: "&6&l[ЛЕГЕНДАРНЫЙ ГРУЗ]"
      boss: "EVOKER"
      mobs:
        - "RAVAGER;1"
        - "VINDICATOR;3"
      items:
        - "NETHERITE_INGOT;1;2"
        - "TOTEM_OF_UNDYING;1;1"
        - "ENCHANTED_GOLDEN_APPLE;1;1"
    engineer:
      name: "&b⚙ [Инженерный Контейнер]"
      boss: "IRON_GOLEM"
      mobs:
        - "PILLAGER;2"
        - "VINDICATOR;1"
      items:
        - "REDSTONE;24;48"
        - "IRON_BLOCK;2;5"
        - "OBSERVER;4;8"
        - "EXPERIENCE_BOTTLE;12;24"
    alchemist:
      name: "&d⚗ [Алхимический Тайник]"
      boss: "WITCH"
      mobs:
        - "WITCH;2"
        - "SLIME;3"
      items:
        - "BLAZE_ROD;3;8"
        - "GHAST_TEAR;1;3"
        - "GOLDEN_CARROT;8;16"
        - "EXPERIENCE_BOTTLE;16;32"
    nether:
      name: "&4🔥 [Адский Разлом]"
      boss: "BLAZE"
      mobs:
        - "WITHER_SKELETON;2"
        - "MAGMA_CUBE;3"
      items:
        - "NETHERITE_SCRAP;1;3"
        - "BLAZE_ROD;8;16"
        - "QUARTZ;32;64"
    cursed:
      name: "&5☠ [ПРОКЛЯТЫЙ ГРУЗ] ☠"
      boss: "WITHER_SKELETON"
      mobs:
        - "PHANTOM;3"
      items:
        - "ROTTEN_FLESH;64;64"
      # Открытие накладывает дебаффы на всех вокруг
    fake:
      name: "&e❓ [ПОДОЗРИТЕЛЬНЫЙ ГРУЗ] ❓"
      boss: "CREEPER"
      mobs: []
      items: []
      # При попытке захвата взрывается как супер-ТНТ

# Радиация
radiation:
  enabled: true
  radius: 20
  damage: 2.0
  safe_potion: "FIRE_RESISTANCE" # Если игрок выпил это зелье, он не получает урон
# --- СЮЖЕТНЫЕ КВЕСТЫ (ЦЕПОЧКИ) ---
quests:
  chains:
    miner_path:
      req_job: "miner"
      req_lvl: 5
      desc: "Убить 50 зомби в шахте"
      target: "ZOMBIE"
      amount: 50
      reward_rep: 200
    blacksmith_path:
      req_job: "blacksmith"
      req_lvl: 10
      desc: "Скрафтить 10 алмазных мечей"
      target: "DIAMOND_SWORD"
      amount: 10
      reward_rep: 500
    hunter_path:
      req_job: "hunter"
      req_lvl: 8
      desc: "Убить 25 скелетов во время серверных охот"
      target: "SKELETON"
      amount: 25
      reward_rep: 300
    engineer_path:
      req_job: "miner"
      req_lvl: 12
      desc: "Скрафтить 16 наблюдателей для инженерного заказа"
      target: "OBSERVER"
      amount: 16
      reward_rep: 450

# --- БАУНТИ (КОНТРАКТЫ) ---
bounty:
  min_rep: 100

# --- ВТОРЖЕНИЕ ИЗ БЕЗДНЫ ---
invasions:
  interval: 7200             # Спавн вторжения (раз в 2 часа)
  min-online: 2              # Минимальный онлайн для запуска
  protected-radius: 32       # Разлом и волны не появляются в приватах
  rift-hp: 100               # Здоровье разлома
  spawn-radius: 1000         # Разлом появляется в пределах 1000 блоков от (0,0)
  mobs-per-wave: 5           # Количество мобов за волну
  wave-interval: 30          # Интервал между волнами (в секундах)
  loot:
    - "DIAMOND;10;20"
    - "NETHERITE_SCRAP;2;5"
    - "ENCHANTED_GOLDEN_APPLE;1;1"
    - "EXPERIENCE_BOTTLE;32;64"

# --- НАПОМИНАНИЯ ОБ АКТИВНЫХ СОБЫТИЯХ ---
reminders:
  interval: 600              # Интервал напоминания об активных событиях на сервере и в ВК в секундах (600 = 10 минут)

# --- ГНЕВ БОГОВ И КАТАКЛИЗМЫ ---
wrath:
  interval: 28800            # Интервал автоматического запуска катаклизмов (28800 = 8 часов)
  spawn-radius: 2000         # Радиус спавна Аватара Гнева и мировых находок
  protected-radius: 48       # Боссы/катаклизмы выбирают только Дикие Земли и не ломают приваты
  vk-event-cost: 1500        # Стоимость запуска ивента через ВК (!ивент) за 1500 репутации ВК

  # --- ПАРАМЕТРЫ БОССА ---
  boss:
    name: "&c&lАватар Гнева Богов"   # Имя босса
    entity-type: "WITHER"             # Тип моба (WITHER, ENDER_DRAGON, etc.)
    health: 1500                      # Максимальное HP
    night-on-spawn: true              # Устанавливать ночь при спавне
    storm-on-spawn: true              # Включать грозу при спавне
    loot:
      enabled: true
      items:
        - "NETHERITE_INGOT;3;5"
        - "DIAMOND_BLOCK;2;4"
        - "ENCHANTED_GOLDEN_APPLE;1;2"
        - "TOTEM_OF_UNDYING;1;1"

  # --- ПАРАМЕТРЫ КАТАКЛИЗМОВ ---
  cataclysms:
    # Глобальные настройки по умолчанию
    default-tick-interval: 40         # Интервал тика по умолчанию (2 сек)

    # Автоматический спавн катаклизмов возле игроков
    auto-spawn:
      enabled: true
      check-interval-seconds: 300     # Как часто проверять (каждые 5 минут)
      chance-percent: 8               # Шанс запуска катаклизма за проверку (%)
      radius: 64                      # Радиус действия спонтанного катаклизма вокруг игрока
      # Весовые множители типов (больше = чаще). Значение по умолчанию: 1.0
      weights:
        acid_rain: 1.0
        earthquake: 1.0
        tempest: 1.0
        meteor_shower: 0.8
        blizzard: 1.0
        eclipse: 0.7
        reputation_bloom: 0.5
        angelic_grace: 0.5
        star_shower: 0.6
        geysers: 1.0
        blood_moon_hunt: 0.7
        treasure_comet: 0.4
        station_fall: 0.3
        fog_shadows: 0.8
        plasma_storm: 0.8
        gravity_anomaly: 0.8

    acid_rain:
      duration-seconds: 180           # Длительность (сек)
      tick-interval: 60               # Интервал тика (тики = сек * 20)
      armor-damage: 1                 # Урон броне за тик
      player-damage: 2.0              # Урон игроку без брони
      poison-level: 0                 # Уровень отравления
    earthquake:
      duration-seconds: 60
      tick-interval: 40
      crack-chance: 15                # Шанс провала под ногами (%)
      fissure-chance: 25              # Шанс трещины (%)
      fissure-length-min: 6
      fissure-length-max: 10
      fissure-depth: 3
    tempest:
      duration-seconds: 120
      tick-interval: 20
      lightning-chance: 25            # Шанс молнии (%)
      wind-push-force: 1.5            # Сила ураганного ветра
    meteor_shower:
      duration-seconds: 120
      tick-interval: 40
      meteor-chance: 30               # Шанс метеорита за тик (%)
      explosion-yield: 2.0            # Мощность взрыва
    blizzard:
      duration-seconds: 120
      tick-interval: 60
      freeze-damage: 1.0              # Урон от обморожения
      heat-check-radius: 3            # Радиус проверки источников тепла
    eclipse:
      duration-seconds: 120
      tick-interval: 100
      mob-spawn-chance: 30            # Шанс спавна моба (%)
    reputation_bloom:
      duration-seconds: 180
      tick-interval: 40
      market-multiplier: 1.5          # Множитель цен на бирже
    angelic_grace:
      duration-seconds: 180
      tick-interval: 40
    star_shower:
      duration-seconds: 120
      tick-interval: 100
      comet-chance: 40                # Шанс падения кометы (%)
      crater-radius: 4                # Радиус кратера
    geysers:
      duration-seconds: 120
      tick-interval: 40
      geyser-chance: 35               # Шанс гейзера за тик (%)
      geyser-damage: 6.0              # Урон от кипятка
      geyser-radius: 2                # Радиус воронки
    blood_moon_hunt:
      duration-seconds: 180
      tick-interval: 80
      mob-spawn-chance: 35            # Шанс спавна охотника (%)
    treasure_comet:
      duration-seconds: 60            # Мгновенное событие (сундук)
    station_fall:
      duration-seconds: 60
      countdown-seconds: 10           # Обратный отсчет перед падением
      crater-radius: 5                # Радиус кратера
      droid-count: 3                  # Количество дроидов охраны
    fog_shadows:
      duration-seconds: 180
      tick-interval: 60
      shadow-spawn-chance: 40         # Шанс спавна тени (%)
      blindness-level: 0
      wither-level: 0
    plasma_storm:
      duration-seconds: 120
      tick-interval: 20
      lightning-chance: 40            # Шанс плазменного удара (%)
      fire-damage: 3.0                # Урон от плазмы
      speed-level: 1                  # Уровень ускорения мобов
    gravity_anomaly:
      duration-seconds: 150
      tick-interval: 40
      launch-chance: 30               # Шанс запуска игрока в небо (%)
      launch-force: 2.5               # Сила подброса
      nausea-level: 1


# --- МЕТЕОРИТЫ ---
meteor:
  interval: 10800            # Раз в 3 часа
  spawn-radius: 2500
  protected-radius: 12       # Кратер не пересекает приватные территории
