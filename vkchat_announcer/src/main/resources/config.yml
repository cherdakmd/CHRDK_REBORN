# ==========================================
# Модуль Автосообщений (VKChatAnnouncer)
# Актуализировано: Июль 2026
# ==========================================
config-version: 2

settings:
  interval: 300              # Интервал между сообщениями, секунды
  random-order: true
  prefix: "&6[CHRDK] &8▸ &f"
  quiz-chance: 20            # Шанс вместо сообщения запустить викторину, %

messages:
  # Базовая навигация и ВК
  - "&fГлавное меню: &e/menu&f. Доступ ко всем системам: нации, кузня, руны, артефакты, ивенты, охота, рынок, работы."
  - "&fПривяжи ВК: &e/vklink&f. Репутация ВК — главная валюта сервера. Баланс: &e/rep&f, переводы: &e/pay <ник> <сумма>&f."
  - "&fНет ВК? Оформи проходку: &e/donate pass&f. 500₽ навсегда — полный доступ без привязки ВК!"

  # Шахтёрские смены
  - "&fШахтёрские смены через ВК: &e!шахта&f в ЛС бота. Смены: &e1ч&f / &e3ч&f / &e8ч&f / &e12ч&f. Награды в &e/stash&f."
  - "&fНе забывай проверять &e/stash&f — все награды со смен приходят туда. Чем дольше смена — тем ценнее лут!"

  # Донат
  - "&fПоддержка сервера: &e/donate info&f. 5 статусов от &b250₽&f до &d5000₽&f. Бонусы к репу, опыту и дропу!"

  # Кузня и руны
  - "&fКузня: &e/forge&f. Ковка MMO-снаряжения за репутацию ВК. Чем выше &eblacksmith&f в &e/jobs&f — тем лучше шансы."
  - "&fЗаточка до &e+25&f через &e/runes&f. Кристаллы заточки добываются с боссов, элиток и в наградах охоты."
  - "&fРуны ограничены слотами по редкости: Common 0, Uncommon 1, Rare 1, Epic 2, Legendary 3, Ancient 4."
  - "&fДефект на предмете? Открой &e/forge&f и очисти дефекты. Дефекты снижают скорость и боевые характеристики."
  - "&fРазборка MMO-снаряжения: &e/salvage&f. Верни часть ценности и получи награды."

  # Артефакты
  - "&fАртефакты через &e/artifacts&f. Артефакты дают постоянные баффы, пока лежат в инвентаре. Проклятия накладывают дебаффы."
  - "&fСинергия артефактов: 3+ артефакта с одинаковым баффом дают бонусный эффект. Полный сет брони поглощает проклятия!"

  # Мобы / охота
  - "&fЭлитные мобы: &e/mobs&f. Архетипы, стихии, телеграф атак и ценный лут. Спавнер-мобы не дают редкий дроп."
  - "&fКонтракты на мобов дают осколки артефактов и репутацию. Проверяй &e/mobs&f на наличие активных контрактов."

  # События
  - "&fИвенты: &e/events&f. Аирдропы, метеориты, боссы, Кровавая Луна, катаклизмы. Все ивенты ищут дикую зону."
  - "&fАлхимический аирдроп каждые 4 часа. 5 тиров сундуков — от обычного до мифического. Успей забрать за 30 минут!"

  # Рынок
  - "&fРынок: &e/market&f. Покупай и продавай ресурсы за репутацию ВК. Цены меняются динамически — следи за трендами!"
  - "&fНа рынке доступны: руды, еда, алхимия, красители, редкие предметы. Выгодная торговля приносит прибыль!"

  # Нации / приваты / телепорты
  - "&fНации: &e/nation&f. Выбери фракцию, покупай приваты и прокачивай защиту. Смена нации сбрасывает земли."
  - "&fПриваты блочные: купи блок через &e/nation buyclaim&f и корми через &e/n feed&f. Один блок = 8×8 защита."
  - "&fТелепорты: &e/rtp&f, &e/home&f, &e/tpa <ник>&f. Стоимость зависит от расстояния. Движение во время подготовки отменяет ТП."

  # Профессии
  - "&fПрофессии: &e/jobs&f. Кузнец помогает ковке, шахтёр даёт бонусы к добыче, охотник усиливает урон по мобам."
  - "&fУровень профессии открывает новые возможности: выше уровень — дешевле ковка, ценнее дроп с мобов и руды."

  # Соцсети и статистика
  - "&fВК группа: &bhttps://vk.com/chrdk_reborn&f. Новости, промокоды и обновления."
  - "&fTelegram разработчика: &bhttps://t.me/cherdakmd&f. Новости проекта и планы развития."
  - "&f%stats%"

formats:
  stats:
    - "&eСтатистика сервера CHRDK REBORN:"
    - "&fИгроков онлайн: &b%online%"
    - "&fЗаходов за сегодня: &b%today_joins%"
    - "&fТоп 1 по репутации: &a%top_rep%"
