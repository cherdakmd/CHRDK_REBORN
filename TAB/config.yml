# ═══════════════════════════════════════════════════════════════
# TAB CONFIG — ЧРДК REBORN
# ═══════════════════════════════════════════════════════════════

# ─── HEADER & FOOTER ───
header-footer:
  enabled: true
  designs:
    default:
      header:
        - "&6&m                                                    "
        - "&6&lЧРДК REBORN &7— &eMinecraft RPG Hardcore"
        - "&b&l%player%&7, добро пожаловать!"
        - "&7Онлайн: &f%online% &7| Ping: &f%ping%&7ms | Мир: &f%world%"
        - ""
      footer:
        - ""
        - "&7Репутация: &e%vkchat_reputation% &7| Ранг: &f%vault_prefix%"
        - "&7Время: &f%time% &7| RAM: &f%memory-used%&7/&f%memory-max% MB"
        - "&eВК: &bhttps://vk.com/chrdk_reborn"
        - "&eДонат: &chttps://donatepay.ru/don/dedworkshop"
        - "&6&m                                                    "

# ─── TABLIST NAME FORMATTING ───
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'

# ─── NAMETAGS (SCOREBOARD TEAMS) ───
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
    - "GROUPS:legend,star,flame,spark,vip,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'

# ─── PLAYERLIST OBJECTIVE (PING) ───
playerlist-objective:
  enabled: true
  value: "%ping%"
  fancy-value: "&7Ping: %ping%ms"
  title: "ЧРДК REBORN"
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'

# ─── BELOWNAME (HEALTH) ───
belowname-objective:
  enabled: true
  value: "%health%"
  fancy-value: "&c%health%"
  fancy-value-default: "NPC"
  title: "&cHP"
  disable-condition: '%world%=disabledworld'

# ─── SPECTATOR FIX ───
prevent-spectator-effect:
  enabled: true

# ─── BOSSBAR ───
bossbar:
  enabled: false

# ─── SCOREBOARD ───
scoreboard:
  enabled: false

# ─── LAYOUT ───
layout:
  enabled: false

# ─── PING SPOOF ───
ping-spoof:
  enabled: false

# ─── GLOBAL PLAYERLIST ───
global-playerlist:
  enabled: false

# ─── PLACEHOLDERS ───
placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "[HH:mm:ss]"
  time-offset: 3
  register-tab-expansion: false
  locale: ru-RU

# ─── PLACEHOLDER OUTPUT REPLACEMENTS ───
placeholder-output-replacements:
  "%essentials_vanished%":
    "yes": "&7| Скрыт"
    "no": ""
  "%luckperms-group%":
    "legend": "&6Легенда"
    "star": "&eЗвезда"
    "flame": "&cПламя"
    "spark": "&aИскра"
    "default": "&7Игрок"

# ─── CONDITIONS ───
conditions:
  nick:
    conditions:
      - "%player%=%essentials_nickname%"
    true: "%player%"
    false: "~%essentials_nickname%"

# ─── PLACEHOLDER REFRESH INTERVALS ───
placeholder-refresh-intervals:
  default-refresh-interval: 500
  "%server_uptime%": 1000
  "%server_tps_1_colored%": 1000
  "%server_unique_joins%": 5000
  "%player_health%": 200
  "%player_ping%": 1000
  "%vault_prefix%": 1000

# ─── GROUPS ───
assign-groups-by-permissions: false

primary-group-finding-list:
  - legend
  - star
  - flame
  - spark
  - vip
  - default

permission-refresh-interval: 1000

debug: false

# ─── MYSQL ───
mysql:
  enabled: false

# ─── PROXY SUPPORT ───
proxy-support:
  enabled: false

# ─── COMPONENTS ───
components:
  minimessage-support: true
  disable-shadow-for-heads: true

# ─── PER-WORLD PLAYERLIST ───
per-world-playerlist:
  enabled: false

config-version: 6
