# ═══════════════════════════════════════════════════════════════
# TAB CONFIG — CHRDK REBORN
# ═══════════════════════════════════════════════════════════════

header-footer:
  enabled: true
  designs:
    default:
      header:
        - "&5&m                                                    "
        - "&5&lCHRDK REBORN &8— &dMinecraft Hardcore RPG"
        - "&f%player%&7, добро пожаловать!"
        - "&7Онлайн: &f%online% &8| &7Мир: &f%world% &8| &7Ping: &f%ping%ms"
        - ""
      footer:
        - ""
        - "&7Репутация ВК: &e%vkchat_reputation% &8| &7Баланс: &a%vault_balance%"
        - "&7Время: &f%time% &8| &7TPS: %server_tps_1_colored%"
        - "&bВК: &fhttps://vk.com/chrdk_reborn"
        - "&dДонат: &f/donate info"
        - "&5&m                                                    "

tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'

scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
    - "GROUPS:overlord,legend,star,flame,spark,vip,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'

playerlist-objective:
  enabled: true
  value: "%ping%"
  fancy-value: "&7Ping: %ping%ms"
  title: "CHRDK REBORN"
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'

belowname-objective:
  enabled: true
  value: "%health%"
  fancy-value: "&c%health%"
  fancy-value-default: "NPC"
  title: "&c❤"
  disable-condition: '%world%=disabledworld'

prevent-spectator-effect:
  enabled: true

bossbar:
  enabled: false

scoreboard:
  enabled: false

layout:
  enabled: false

ping-spoof:
  enabled: false

global-playerlist:
  enabled: false

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "[HH:mm:ss]"
  time-offset: 3
  register-tab-expansion: false
  locale: ru-RU

placeholder-output-replacements:
  "%essentials_vanished%":
    "yes": "&7| Скрыт"
    "no": ""
  "%luckperms-group%":
    "overlord": "&d💎 Властелин"
    "legend": "&5👑 Легенда"
    "star": "&e⭐ Звезда"
    "flame": "&6🔥 Пламя"
    "spark": "&b⚡ Искра"
    "vip": "&aVIP"
    "default": "&7Игрок"

conditions:
  nick:
    conditions:
      - "%player%=%essentials_nickname%"
    true: "%player%"
    false: "~%essentials_nickname%"

placeholder-refresh-intervals:
  default-refresh-interval: 500
  "%server_uptime%": 1000
  "%server_tps_1_colored%": 1000
  "%server_unique_joins%": 5000
  "%player_health%": 200
  "%player_ping%": 1000
  "%vault_prefix%": 1000
  "%vault_balance%": 5000

assign-groups-by-permissions: false

primary-group-finding-list:
  - overlord
  - legend
  - star
  - flame
  - spark
  - vip
  - default

permission-refresh-interval: 1000

debug: false

mysql:
  enabled: false

proxy-support:
  enabled: false

components:
  minimessage-support: true
  disable-shadow-for-heads: true

per-world-playerlist:
  enabled: false

config-version: 6
