plugins {
    id 'java'
}

group = 'ru.example'
version = '2.1.0'

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly project(':vkchat_core')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes(
            'Main-Class': 'ru.example.vkchatmarket.VKChatMarketPluginV2'
        )
    }
    archiveFileName = 'VKChatMarket-2.1.0.jar'
}
